name: Wird
options:
  bundleIdPrefix: om.alkhanbashi
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ar
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "9"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
targets:
  Wird:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["Web/**"]
      - path: App/Web
        type: folder
        buildPhase: resources
      - path: Shared
      - path: Widget/WirdWidgets.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: om.alkhanbashi.wird
        PRODUCT_NAME: Wird
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: "NO"
    entitlements:
      path: App/Wird.entitlements
      properties:
        com.apple.security.application-groups: [group.om.alkhanbashi.wird]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "وِرد"
        CFBundleName: "Wird"
        CFBundleDevelopmentRegion: ar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBG
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        UIBackgroundModes: [audio, fetch]
        BGTaskSchedulerPermittedIdentifiers: [om.alkhanbashi.wird.refresh]
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        WirdDeveloper: "أحمد الخنبشي"
    dependencies:
      - target: WirdWidgets
  WirdWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
        excludes: ["Info.plist", "*.entitlements"]
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: om.alkhanbashi.wird.widgets
        GENERATE_INFOPLIST_FILE: "NO"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"
    entitlements:
      path: Widget/WirdWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.om.alkhanbashi.wird]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: "وِرد"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSSupportsLiveActivities: true
