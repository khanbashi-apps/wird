<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{box-sizing:border-box;-webkit-text-size-adjust:100%}
body{margin:0;font:14px/1.5 -apple-system,system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
textarea,input,.dtext,.mushaf,.ist-text{-webkit-user-select:text;user-select:text}
img{max-width:100%}
[hidden]{display:none!important}
/* the page background is drawn by body; the fixed decor layers only leaked under the home indicator */
.bg,.bg-pat,.bg-stars{display:none!important}
.rem-r{display:flex;align-items:center;gap:10px;flex:none}
.tchip{position:relative;display:inline-flex;align-items:center;justify-content:center;min-width:86px;height:36px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--glass);font-weight:600;font-size:14px}
.tchip input{position:absolute;inset:0;width:100%;height:100%;opacity:0;-webkit-appearance:none;appearance:none;border:0;background:none;font-size:16px}
.g-ol{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:8px;line-height:1.7}
</style>
</head>
<body>
<title>تطبيق وِرد</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="fonts.css">
<style>
/* Layout: phone column over a fixed gradient + geometric-pattern backdrop; every surface is frosted glass; octagram medallions carry counts */
:root{
  --bg:#E9EEF6; --b1:#C7D5EE; --b2:#F3E4C4; --b3:rgba(165,122,44,.18);
  --fg:#13254A; --muted:#5A6886; --acc:#1D3A70; --acc-fg:#FFFFFF; --orn:#A57A2C; --done:#2F8A62; --done-fg:#FFFFFF;
  --glass:rgba(255,255,255,.55); --gb:rgba(255,255,255,.85); --gh:rgba(255,255,255,.9); --line:rgba(19,37,74,.12); --sh:rgba(19,37,74,.16);
  --f-ui:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-disp:"Amiri","Traditional Arabic",serif;
  --f-quran:"Amiri Quran","Amiri","Traditional Arabic",serif;
  --q-size:26px; --d-size:21px;
  --ic-bg1:#FFFFFF; --ic-bg2:#C7D5EE; --ic-bead:#1D3A70; --ic-imam:#A57A2C; --ic-tx:#13254A;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1631; --b1:#1C3A6E; --b2:#132C58; --b3:rgba(227,184,97,.16);
  --fg:#F2ECDD; --muted:#9AA8C2; --acc:#E3B861; --acc-fg:#0A1631; --orn:#E3B861; --done:#6FD39C; --done-fg:#0A1631;
  --glass:rgba(255,255,255,.06); --gb:rgba(255,255,255,.14); --gh:rgba(255,255,255,.16); --line:rgba(255,255,255,.10); --sh:rgba(0,0,0,.45); --ic-bg1:#1C3A6E; --ic-bg2:#0A1631; --ic-bead:#E3B861; --ic-imam:#E3B861; --ic-tx:#F2ECDD; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1631; --b1:#1C3A6E; --b2:#132C58; --b3:rgba(227,184,97,.16);
  --fg:#F2ECDD; --muted:#9AA8C2; --acc:#E3B861; --acc-fg:#0A1631; --orn:#E3B861; --done:#6FD39C; --done-fg:#0A1631;
  --glass:rgba(255,255,255,.06); --gb:rgba(255,255,255,.14); --gh:rgba(255,255,255,.16); --line:rgba(255,255,255,.10); --sh:rgba(0,0,0,.45); --ic-bg1:#1C3A6E; --ic-bg2:#0A1631; --ic-bead:#E3B861; --ic-imam:#E3B861; --ic-tx:#F2ECDD; color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{direction:rtl;touch-action:manipulation;-webkit-text-size-adjust:100%}
body{touch-action:manipulation}
html,body{background:var(--bg);color:var(--fg);overflow-x:clip}
body{font-family:var(--f-ui);font-size:15px;line-height:1.6}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,.card:focus-visible{outline:2px solid var(--orn);outline-offset:3px}
.digits{font-variant-numeric:tabular-nums}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ===== backdrop ===== */
.bg{position:fixed;inset:0;z-index:-3;background:
  radial-gradient(65% 45% at 88% 2%, var(--b1), transparent 72%),
  radial-gradient(55% 40% at 0% 38%, var(--b2), transparent 70%),
  radial-gradient(80% 45% at 30% 104%, var(--b3), transparent 70%), var(--bg);transition:background .6s}
.bg-pat{position:fixed;inset:0;z-index:-2;background:var(--orn);opacity:.07;-webkit-mask:var(--pat-star) repeat;mask:var(--pat-star) repeat;-webkit-mask-size:64px;mask-size:64px;
  -webkit-mask-image:var(--pat-star),linear-gradient(#000,transparent 75%);mask-image:var(--pat-star),linear-gradient(#000,transparent 75%);-webkit-mask-composite:source-in;mask-composite:intersect}
.bg-stars{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bg,.bg-pat,.bg-stars{top:calc(-1*env(safe-area-inset-top,0px));bottom:calc(-1*env(safe-area-inset-bottom,0px) - 1px)}
.bg-star{position:absolute;color:var(--orn);opacity:.13;pointer-events:none;animation:turn 160s linear infinite}
.bg-star.a{width:min(110vw,520px);top:-14%;inset-inline-start:-30%}
.bg-star.b{width:min(70vw,320px);bottom:-8%;inset-inline-end:-22%;opacity:.08;animation-direction:reverse}
body.nopat .bg-pat,body.nopat .bg-star{display:none}
@keyframes turn{to{transform:rotate(360deg)}}

/* ===== glass ===== */
.glass{position:relative;background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%);border:1px solid var(--gb);box-shadow:inset 0 1px 0 var(--gh),0 14px 34px -16px var(--sh)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(145deg,rgba(255,255,255,.14),transparent 40%);pointer-events:none}

.app{max-width:480px;margin:0 auto;min-height:100%;padding-bottom:130px}
.app:has(.ist-ring){padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ===== header ===== */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;transition:background .25s,border-color .25s;border-bottom:1px solid transparent}
.bar.scrolled{background:color-mix(in srgb,var(--bg) 70%,transparent);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-bottom-color:var(--line)}
.bar-in{display:flex;align-items:center;gap:8px;padding-block:12px}
.bar h1{font-family:var(--f-disp);font-size:22px;font-weight:700;margin:0;flex:1;min-width:0;line-height:1.3}
.ibtn{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none}
.brand{display:flex;align-items:center;gap:10px;flex:1}
.brand-mark{width:40px;height:40px;clip-path:var(--oct);background:linear-gradient(150deg,var(--orn),color-mix(in srgb,var(--orn) 60%,var(--bg)));color:var(--bg);display:grid;place-items:center;font-family:var(--f-disp);font-size:20px;font-weight:700;line-height:1;padding-bottom:3px}
.brand b{font-family:var(--f-disp);font-size:24px;font-weight:700;line-height:1}
.brand-ic,.sws-ic{width:42px;height:42px;border-radius:11px;flex:none;background:radial-gradient(80% 70% at 75% 15%,var(--ic-bg1),var(--ic-bg2) 75%);box-shadow:0 6px 14px -6px var(--sh),inset 0 1px 0 rgba(255,255,255,.15),inset 0 0 0 1px var(--line);display:grid;place-items:center;transition:background .4s}
.brand-ic svg{width:38px;height:38px}
.brand-ic .bd,.sws-ic .bd{fill:var(--ic-bead)}.brand-ic .im,.sws-ic .im{fill:var(--ic-imam)}.brand-ic .tx,.sws-ic .tx{fill:var(--ic-tx)}
.sws-ic{width:58px;height:58px;border-radius:15px}.sws-ic svg{width:52px;height:52px}





/* ===== launch animation ===== */
#splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:radial-gradient(60% 40% at 50% 50%,color-mix(in srgb,var(--orn) 6%,transparent),transparent 70%),var(--bg);transition:opacity .5s ease,transform .5s ease}
#splash.out{opacity:0;transform:scale(1.05);pointer-events:none}
.sp-wrap{position:relative;width:128px;height:128px}
.sp-glow{position:absolute;inset:-80px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--orn) 26%,transparent) 0,color-mix(in srgb,var(--orn) 10%,transparent) 42%,transparent 70%);opacity:0;transform:scale(.5)}
.sp-glow.g2{inset:-130px;background:radial-gradient(circle,transparent 38%,color-mix(in srgb,var(--orn) 9%,transparent) 52%,transparent 70%)}
#splash.s4 .sp-glow{animation:spGlow 2s ease-out infinite}
#splash.s4 .sp-glow.g2{animation-delay:.35s}
@keyframes spGlow{0%{opacity:0;transform:scale(.6)}30%{opacity:1}100%{opacity:0;transform:scale(1.2)}}
.sp-icon{position:absolute;inset:0;border-radius:50%;overflow:hidden;background:color-mix(in srgb,var(--orn) 16%,var(--bg));transform:scale(.04);opacity:.4;transition:transform .55s cubic-bezier(.3,1.25,.5,1),border-radius .55s ease,opacity .3s,box-shadow .4s}
#splash.s1 .sp-icon{transform:scale(1);border-radius:29px;opacity:1}
.sp-fill{position:absolute;inset:0;background:radial-gradient(80% 70% at 75% 15%,var(--ic-bg1),var(--ic-bg2) 75%);opacity:0;transition:opacity .4s ease}
#splash.s3 .sp-fill{opacity:1}
#splash.s3 .sp-icon{box-shadow:0 20px 44px -16px rgba(10,22,49,.65),inset 0 1px 0 rgba(255,255,255,.15)}
.sp-icon svg{position:absolute;inset:7px;width:calc(100% - 14px);height:calc(100% - 14px);transform:translateY(-80px);opacity:0;transition:transform .5s cubic-bezier(.3,1.45,.5,1),opacity .25s}
#splash.s2 .sp-icon svg{transform:none;opacity:1}
.sp-icon .bd,.sp-icon .im,.sp-icon .tx{fill:var(--muted);transition:fill .4s ease}
#splash.s3 .sp-icon .bd{fill:var(--ic-bead)}#splash.s3 .sp-icon .im{fill:var(--ic-imam)}
#splash.s3 .sp-icon .tx{fill:var(--ic-tx)}
#splash.s2 .sp-wrap{animation:spDip .5s ease .1s}
#splash.s4 .sp-wrap{animation:spBob 2.6s ease-in-out infinite}
@keyframes spDip{45%{transform:translateY(7px)}}
@keyframes spBob{50%{transform:translateY(-4px)}}
.orb{transform-box:view-box;transform-origin:100px 100px}
#splash.s5 .sp-icon .orb{animation:imSpin 1.8s cubic-bezier(.65,0,.35,1) 1 both}
@keyframes imSpin{to{transform:rotate(360deg)}}
.sp-skip{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--muted);opacity:.7}
.brand small{display:block;font-size:11px;color:var(--muted);margin-top:2px}

/* ===== ornaments ===== */
.band{height:24px;border-block:1px solid color-mix(in srgb,var(--orn) 45%,transparent);position:relative}
.band::after{content:"";position:absolute;inset:3px 0;background:var(--orn);opacity:.75;-webkit-mask:var(--pat-band) repeat-x center/auto 100%;mask:var(--pat-band) repeat-x center/auto 100%}
.cart{position:relative;display:inline-grid;place-items:center;padding:8px 40px;min-width:200px}
.cart svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.cart path{fill:color-mix(in srgb,var(--orn) 10%,transparent);stroke:var(--orn);stroke-width:1.2;vector-effect:non-scaling-stroke}
.cart span{position:relative;font-family:var(--f-disp);font-weight:700;font-size:22px;color:var(--orn)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 12px;border-radius:99px;border:1px solid var(--gb);background:var(--glass)}

/* ===== home ===== */
.greet{padding-block:14px 4px}
.greet h2{font-family:var(--f-disp);font-size:34px;font-weight:700;margin:0;line-height:1.35;text-wrap:balance}
.greet p{margin:0;color:var(--muted);font-size:13.5px}
.pv-flag{display:inline-flex;gap:6px;align-items:center;margin-top:8px;font-size:12px;color:var(--orn);border:1px dashed var(--orn);border-radius:99px;padding:3px 10px}
.pv-flag button{color:var(--orn);text-decoration:underline;font-size:12px}

.hero{margin-top:16px;border-radius:28px;overflow:hidden}
.hero .band{border-top:0}
.hero-body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:10px}
.hero-row{display:flex;gap:14px;align-items:flex-start}
.hero-row>div:first-child{flex:1;min-width:0}
.hero h3{font-family:var(--f-disp);font-size:36px;font-weight:700;margin:6px 0 0;line-height:1.3;text-wrap:balance}
.hero p{margin:4px 0 0;color:var(--muted);font-size:14px}
.big-num{text-align:center;flex:none;padding-top:6px}
.big-num b{display:block;font-family:var(--f-disp);font-size:58px;line-height:1;color:var(--orn);font-weight:700}
.big-num small{font-size:12px;color:var(--muted)}
.meter{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--orn),color-mix(in srgb,var(--orn) 55%,var(--fg)));transition:width .4s}
.cta{margin-top:6px;width:100%;padding:14px;border-radius:16px;background:var(--acc);color:var(--acc-fg);font-weight:600;font-size:15px;box-shadow:0 10px 24px -12px var(--acc);display:flex;justify-content:center;align-items:center;gap:8px}
.note{font-size:12.5px;color:var(--orn)}

.sec-title{position:relative;font-size:13px;color:var(--muted);margin:26px 2px 10px;font-weight:500;display:flex;align-items:center;gap:10px}
.sec-title::after{content:"";flex:1;height:1px;background:linear-gradient(to left,transparent,var(--line))}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border-radius:22px;padding:16px;text-align:start;display:flex;flex-direction:column;gap:12px;min-height:140px;transition:transform .15s}
.tile:active{transform:scale(.97)}
.oct-ic{width:46px;height:46px;clip-path:var(--oct);background:color-mix(in srgb,var(--orn) 18%,transparent);color:var(--orn);display:grid;place-items:center}
.tile b{font-size:15px;font-weight:600;display:block}
.tile small{color:var(--muted);font-size:12.5px}
.tile .meter{margin-top:auto;height:4px}
.tile.is-done .meter i{background:var(--done)}

.week{border-radius:22px;padding:16px 14px 14px}
.week-grid{display:grid;grid-template-columns:44px repeat(7,1fr);gap:10px 4px;align-items:center;text-align:center;font-size:12px;color:var(--muted)}
.week-grid .lbl{text-align:start}
.wdot{width:16px;height:16px;margin:auto;clip-path:var(--oct);background:var(--line)}
.wdot.on{background:var(--done)}
.wd.today{color:var(--orn);font-weight:600}

/* ===== dhikr ===== */
.prog{padding-block:0 12px}
.prog-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-bottom:6px}
.prog-row b{color:var(--fg);font-weight:600}
.meter.full i{background:var(--done)}
.seg{display:flex;border-radius:14px;overflow:hidden;flex:none;border:1px solid var(--line)}
.seg.eq button{width:64px;min-width:64px;padding:0}
.row.stack{flex-wrap:wrap}
.row.stack .lab{flex:1 1 100%}
.row.stack .seg{flex:1 1 100%}
.row.stack .seg button{flex:1;min-width:0}
.seg button{min-width:48px;height:40px;font-weight:600;padding:0 10px;position:relative;white-space:nowrap}
.seg button+button{border-inline-start:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--acc-fg)}
.list{display:flex;flex-direction:column;gap:16px;padding-top:12px}
.card{border-radius:26px;padding:20px 20px 16px;cursor:pointer;user-select:none;-webkit-user-select:none;transition:opacity .4s,transform .12s}
.card:active{transform:scale(.99)}
.card.done{opacity:.5}
.card.flash{animation:flash 1.3s}
@keyframes flash{30%{box-shadow:0 0 0 2px var(--orn),0 0 30px -4px var(--orn)}}
.card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:12px;color:var(--muted)}
.card-top .no{font-family:var(--f-disp);font-size:17px;color:var(--orn);display:flex;align-items:center;gap:6px}
.card-top .no::before{content:"";width:9px;height:9px;clip-path:var(--oct);background:var(--orn)}
.bsm{font-family:var(--f-quran);text-align:center;color:var(--muted);font-size:calc(var(--d-size) * .9);margin:0 0 4px}
.dtext{font-family:var(--f-disp);font-size:var(--d-size);line-height:2.05;margin:0;text-align:justify}
.dtext.q{font-family:var(--f-quran);font-size:calc(var(--d-size) + 1px);line-height:2.3}
.vbtn{margin-top:8px;font-size:12.5px;color:var(--muted);display:inline-flex;align-items:center;gap:4px;padding:4px 0}
.vbtn svg.i{width:14px;height:14px;transition:transform .2s}
.vbtn[aria-expanded="true"] svg.i{transform:rotate(180deg)}
.virtue{font-size:13.5px;color:var(--muted);line-height:1.8;padding:10px 12px;margin-top:6px;border-radius:14px;background:color-mix(in srgb,var(--orn) 8%,transparent);border:1px solid color-mix(in srgb,var(--orn) 22%,transparent)}
.virtue cite{display:block;font-style:normal;font-size:12px;color:var(--orn);margin-top:2px}
.counter{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.sbtn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.sbtn.beads{color:var(--orn)}
.sbtn.ghost{visibility:hidden}

/* octagram medallion */
.med{width:88px;height:88px;position:relative;flex:none}
.med svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.med .trk{fill:none;stroke:var(--line);stroke-width:2.5}
.med .val{fill:none;stroke:var(--orn);stroke-width:2.5;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .3s}
.med .oct{fill:color-mix(in srgb,var(--orn) 14%,transparent);stroke:var(--orn);stroke-width:1.3;transform-origin:50% 50%;transition:fill .4s}
.med .n{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1}
.med .n b{font-family:var(--f-disp);font-size:30px;font-weight:700;color:var(--orn);display:block}
.med .n small{font-size:10px;color:var(--muted);display:block;margin-top:2px}
.med.spin .oct{animation:spin .4s cubic-bezier(.3,.7,.3,1)}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(45deg)}}
.card.done .med .oct{fill:var(--done);stroke:var(--done)}
.card.done .med .val{stroke:var(--done)}
.card.done .med .n b{color:var(--done-fg);font-size:26px}
body.compact .card{padding:14px 16px 10px}
body.compact .vbtn,body.compact .virtue{display:none}
body.compact .counter{margin-top:8px;padding-top:8px}
body.compact .med{width:68px;height:68px}
body.compact .med .n b{font-size:24px}

.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:25;padding:13px 20px;border-radius:99px;font-weight:500;font-size:14px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.allset{text-align:center;padding:30px 10px;color:var(--done)}
.allset b{font-family:var(--f-disp);font-size:24px;display:block}
.allset small{color:var(--muted)}

/* ===== undo / toast ===== */
.undo{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:35;transform:translate(-50%,16px);opacity:0;pointer-events:none;border-radius:16px;padding:6px 6px 6px 14px;display:flex;align-items:center;gap:12px;font-size:13.5px;transition:.22s;white-space:nowrap}
.undo.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.undo button{background:var(--acc);color:var(--acc-fg);font-weight:600;padding:7px 14px;border-radius:11px;display:flex;gap:6px;align-items:center}
.undo button svg.i{width:16px;height:16px}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;padding:10px 16px;border-radius:14px;font-size:13.5px;z-index:60;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ===== tasbeeh ===== */

function period(){
  if (previewMode !== 'now') return previewMode;
  const h = nowH(), w = new Date().getDay();
  if ((w===4 && h>=T.maghrib) || (w===5 && h<T.maghrib)) return 'friday';
  if (h>=T.fajr && h<11) return 'morning';
  if (h>=T.asr && h<T.isha+1.5) return 'evening';
  if (h>=T.fajr - ((24 - T.maghrib + T.fajr)/3) && h<T.fajr) return 'sahar';
  return 'night';
}

function resolvedDark(){
  if (S.theme==='dark') return true;
  if (S.theme==='light') return false;
  if (S.theme==='auto'){
    if (previewMode!=='now') return previewMode!=='morning';
    const h = nowH(); return h>=T.maghrib || h<T.fajr;
  }
  return hostTheme ? hostTheme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
}
function applyTheme(){
  const dark = resolvedDark(), c = PAL[S.pal][dark?'dark':'light'];
  root.dataset.theme = dark ? 'dark' : 'light';
  for (const k in c) root.style.setProperty('--'+k, c[k]);
  for (const [k,v] of Object.entries(iconVars(c, dark))) root.style.setProperty(k, v);
  root.style.setProperty('--paper', dark ? `color-mix(in srgb, ${c.b1} 32%, ${c.bg})` : `color-mix(in srgb, ${c.b1} 20%, #FFFDF7)`);
  root.style.setProperty('--paper-fg', c.fg);
  root.style.setProperty('--paper-edge', dark ? `color-mix(in srgb, ${c.b1} 50%, #000)` : `color-mix(in srgb, ${c.b1} 55%, #D9CFB8)`);
  root.style.setProperty('--frame', frameImg(c.orn, dark ? c.b1 : c.acc));
  root.style.setProperty('--done-fg', dark ? c.bg : '#FFFFFF');
  root.style.setProperty('--glass', dark ? 'rgba(255,255,255,.06)' : 'rgba(255,255,255,.52)');
  root.style.setProperty('--gb', dark ? 'rgba(255,255,255,.14)' : 'rgba(255,255,255,.85)');
  root.style.setProperty('--gh', dark ? 'rgba(255,255,255,.16)' : 'rgba(255,255,255,.95)');
  root.style.setProperty('--line', dark ? 'rgba(255,255,255,.10)' : `color-mix(in srgb, ${c.fg} 12%, transparent)`);
  root.style.setProperty('--sh', dark ? 'rgba(0,0,0,.5)' : `color-mix(in srgb, ${c.fg} 22%, transparent)`);
  root.style.setProperty('--d-size', S.dSize+'px');
  root.style.setProperty('--q-size', S.qSize+'px');
  document.body.classList.toggle('compact', S.compact);
  document.body.classList.toggle('nopat', !S.pattern);
}
function frameImg(o, a){
  const st = (x,y,r) => { let d=''; for (let k=0;k<16;k++){ const t=(k*22.5-90)*Math.PI/180, q=k%2?r*.7654:r; d+=(k?'L':'M')+(x+q*Math.cos(t)).toFixed(2)+' '+(y+q*Math.sin(t)).toFixed(2) } return d+'Z' };
  const dia = (x,y,r) => `M${x} ${y-r}L${x+r} ${y}L${x} ${y+r}L${x-r} ${y}Z`;
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='30' height='30' viewBox='0 0 30 30'><rect x='.7' y='.7' width='28.6' height='28.6' fill='none' stroke='${o}' stroke-width='1.3'/><rect x='9' y='9' width='12' height='12' fill='none' stroke='${o}' stroke-width='.8'/><path fill='${o}' d='${dia(15,4.8,2.6)}${dia(15,25.2,2.6)}${dia(4.8,15,2.6)}${dia(25.2,15,2.6)}'/><path fill='${a}' fill-opacity='.55' d='${dia(15,4.8,1.1)}${dia(15,25.2,1.1)}${dia(4.8,15,1.1)}${dia(25.2,15,1.1)}'/><path fill='${o}' d='${st(4.8,4.8,3.6)}${st(25.2,4.8,3.6)}${st(4.8,25.2,3.6)}${st(25.2,25.2,3.6)}'/></svg>`;
  return `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
}
function iconVars(c, dark){

              : {'--ic-bg1':'#FFFFFF','--ic-bg2':c.b1,'--ic-bead':c.acc,'--ic-imam':c.orn,'--ic-tx':c.fg};
}

function medHTML(r, total, done){
  const C = 2*Math.PI*46, prog = total>1 ? (total-r)/total : (done?1:0);
  return `<div class="med"><svg viewBox="0 0 100 100"><circle class="trk" cx="50" cy="50" r="46"/>
    <circle class="val" cx="50" cy="50" r="46" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-prog)}"/>
    <path class="oct" d="${octPath(50,50,36)}"/></svg>
    <div class="n">${done?'<div><b>✓</b></div>':`<div><b class="digits">${AR(r)}</b>${total>1?`<small>من ${AR(total)}</small>`:''}</div>`}</div></div>`;
}

/* settings sheet: spring physics, drag to dismiss */
let sheetOpen = false, sheetY = 0, sheetAnim = 0;
const sheetH = () => sheet.getBoundingClientRect().height - 40;
function setSheetY(y){
  sheetY = y; sheet.style.transform = `translate3d(0,${y}px,0)`;
  scrim.style.opacity = Math.max(0, Math.min(1, 1 - Math.max(0, y) / sheetH())).toFixed(3);
}
function springSheet(to, v0, ratio, stiff, done){
  cancelAnimationFrame(sheetAnim);
  let x = sheetY, v = v0 * 1000, last = performance.now();
  const k = stiff, c = 2 * ratio * Math.sqrt(k);
  const step = now => {
    let dt = Math.min(0.032, (now - last) / 1000); last = now;
    for (let n = 0; n < 4; n++){ const h = dt/4, a = -k*(x - to) - c*v; v += a*h; x += v*h }
    setSheetY(x);
    if (Math.abs(x - to) < 0.4 && Math.abs(v) < 8){ setSheetY(to); done && done(); return }
    sheetAnim = requestAnimationFrame(step);
  };
  sheetAnim = requestAnimationFrame(step);
}
function openSheet(){
  sheet.innerHTML = sheetHTML();
  scrim.hidden = sheet.hidden = false; scrim.style.transition = 'none'; document.body.classList.add('lock'); sheetOpen = true;
  sheet.style.transition = 'none';
  requestAnimationFrame(()=>{ setSheetY(sheetH() + 40); springSheet(0, 0, 0.78, 170) });
}
function closeSheet(v){
  if (!sheetOpen) return; sheetOpen = false; document.body.classList.remove('lock');
  const target = sheetH() + 60;
  // keep the release speed, then glide out smoothly (no bounce)
  springSheet(target, Math.max(0, v||0), 1, 110, ()=>{ scrim.hidden = sheet.hidden = true; render(true) });
}
(function(){
  let y0 = 0, base = 0, samples = [], dragging = false, armed = false, fromTop = false, body = null, crossed = false, isRange = false, moved = 0;
  const vel = () => { const now = performance.now(); const s = samples.filter(p => now - p[1] < 90); if (s.length < 2) return 0; const a = s[0], b = s[s.length-1]; return (b[0]-a[0]) / Math.max(1, b[1]-a[1]) };
  const start = (y, target) => {
    if (!sheetOpen) return;
    isRange = !!target.closest('input[type=range]'); if (isRange) return;
    armed = true; dragging = false; moved = 0; y0 = y; samples = [[y, performance.now()]];
    fromTop = !!target.closest('.sheet-top'); body = document.getElementById('sheetBody'); crossed = false;
    if (sheetAnim && fromTop){ cancelAnimationFrame(sheetAnim); sheetAnim = 0; dragging = true; base = sheetY; sheet.classList.add('dragging') }
  };
  const move = (y, e) => {
    if (!armed) return;
    samples.push([y, performance.now()]); if (samples.length > 8) samples.shift();
    const dy = y - y0; moved = Math.max(moved, Math.abs(dy));
    if (!dragging){
      const atTop = !body || body.scrollTop <= 0;
      if (fromTop || (dy > 0 && atTop)){ dragging = true; base = sheetY; y0 = y; cancelAnimationFrame(sheetAnim); sheet.classList.add('dragging') }
      else { armed = false; return }
    }
    if (e && e.cancelable) e.preventDefault();
    const d = base + (y - y0);
    setSheetY(d >= 0 ? d : -Math.sqrt(-d) * 3.2);
    const c = sheetY > sheetH()*0.3; if (c !== crossed){ crossed = c; if (c) vib(6) }
  };
  const end = () => {
    if (!armed) return; armed = false;
    if (!dragging) return; dragging = false; sheet.classList.remove('dragging');
    const v = vel();
    if (sheetY > sheetH()*0.3 || v > 0.5) closeSheet(v);
    else springSheet(0, Math.min(0, v), 0.72, 220);
  };
  sheet.addEventListener('touchstart', e => start(e.touches[0].clientY, e.target), {passive:true});
  sheet.addEventListener('touchmove', e => move(e.touches[0].clientY, e), {passive:false});
  sheet.addEventListener('touchend', end); sheet.addEventListener('touchcancel', end);
  sheet.addEventListener('mousedown', e => start(e.clientY, e.target));
  addEventListener('mousemove', e => { if (armed) move(e.clientY, e) });
  addEventListener('mouseup', end);
  sheet.addEventListener('click', e => { if (moved > 6){ e.stopPropagation(); e.preventDefault(); moved = 0 } }, true);
})();
function resheet(){ const b = document.getElementById('sheetBody'), y = b ? b.scrollTop : 0; sheet.innerHTML = sheetHTML(); const nb = document.getElementById('sheetBody'); if (nb) nb.scrollTop = y }
scrim.addEventListener('click', () => closeSheet());
sheet.addEventListener('click', e => {

  const m = t.closest('[data-mode]'); if (m){ S.theme = m.dataset.mode; saveS(); applyTheme(); resheet(); return }

/* ===== counting & undo ===== */
let tt, ut;
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(()=>t.classList.remove('show'), 2200) }
const undoEl = document.getElementById('undo');
function showUndo(txt){ document.getElementById('undoTxt').textContent = txt; document.getElementById('undoBtn').innerHTML = I.undo+' تراجع'; undoEl.classList.add('show'); clearTimeout(ut); ut = setTimeout(hideUndo, 3000) }
function hideUndo(){ undoEl.classList.remove('show') }
document.getElementById('undoBtn').addEventListener('click', () => {
  if (!lastAct) return;
  const {cat,i,prev} = lastAct; lastAct = null;
  if (doneCount(cat)===DATA[cat].length) logUndo(cat);
  if (prev===DATA[cat][i].r) delete counts[cat].c[i]; else counts[cat].c[i] = prev; saveC();
  vib(8); hideUndo();
  if (!beadsEl.hidden){ beadsTurns = Math.max(0, beadsTurns-1); paintBeads() } else refreshCard(cat,i);
});
function updateProgress(cat){
  const pd = document.getElementById('pDone'); if (!pd) return;
  const n = DATA[cat].length, d = doneCount(cat);
  pd.textContent = AR(d);
  document.getElementById('pPct').textContent = AR(Math.round(d/n*100))+'٪';
  const bar = document.getElementById('pBar'); bar.querySelector('i').style.width = (d/n*100)+'%'; bar.classList.toggle('full', d===n);
  document.getElementById('allset').hidden = d!==n;
  document.getElementById('fab').hidden = d===n;
}
function refreshCard(cat,i,anim){
  const el = document.querySelector(`[data-card="${i}"]`); if (!el) return;
  const tmp = document.createElement('div'); tmp.innerHTML = cardHTML(cat,i);
  const nu = tmp.firstElementChild; el.replaceWith(nu);
  if (anim) nu.querySelector('.med').classList.add('spin');
  updateProgress(cat);
}
function goNext(cat){
  const i = DATA[cat].findIndex((_,k)=>remaining(cat,k)>0);
  const el = document.querySelector(`[data-card="${i}"]`);
  if (el){ el.scrollIntoView({behavior:'smooth',block:'center'}); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash') }
}
function tap(cat,i,inBeads){
  const r = remaining(cat,i); if (r===0) return;
  lastAct = {cat,i,prev:r};
  counts[cat].c[i] = r-1; saveC();
  const nowDone = r-1===0;
  vib(nowDone ? [35,70,35] : 12);
  if (nowDone && doneCount(cat)===DATA[cat].length) logDone(cat);
  showUndo(nowDone ? `تمّ الذكر ${AR(i+1)}` : `بقي ${AR(r-1)}`);
  if (!inBeads){
    refreshCard(cat,i,true);
    if (nowDone && S.autoNext && doneCount(cat)<DATA[cat].length) setTimeout(()=>goNext(cat), 700);
  } else updateProgress(cat);
}

/* ===== clicks ===== */
app.addEventListener('click', e => {
  const t = e.target;
  const g = t.closest('[data-go]'); if (g){ go(g.dataset.go); return }
  const a = t.closest('[data-act]')?.dataset.act;
  if (a==='mode'){ S.theme = resolvedDark() ? 'light' : 'dark'; saveS(); render(true); toast(S.theme==='dark'?'الوضع الليلي':'الوضع النهاري'); return }
  if (a==='settings'){ openSheet(); return }
  if (a==='pvnow'){ previewMode = 'now'; render(true); return }
  const cat = route();
  if (DATA[cat]){
    if (a==='dPlus'||a==='dMinus'){ S.dSize = Math.max(16, Math.min(32, S.dSize + (a==='dPlus'?2:-2))); saveS(); applyTheme(); return }
    if (a==='next'){ goNext(cat); return }
    const v = t.closest('[data-virtue]'); if (v){ const i = v.dataset.virtue; openVirtue[cat+i] = !openVirtue[cat+i]; refreshCard(cat,+i); return }
    const rs = t.closest('[data-reset]'); if (rs){ const i = +rs.dataset.reset; if (doneCount(cat)===DATA[cat].length) logUndo(cat); delete counts[cat].c[i]; saveC(); vib(8); refreshCard(cat,i); return }
    const b = t.closest('[data-beads]'); if (b){ openBeads(+b.dataset.beads); return }
    const c = t.closest('[data-card]'); if (c){ tap(cat, +c.dataset.card); return }
  }
  if (SURAH[cat]){
    const book = S.reader==='book' && BK;
    if (a==='qPlus'||a==='qMinus'){
      if (book){ const nz = Math.max(1, Math.min(2, bookZoom + (a==='qPlus'?0.25:-0.25))); if (nz===bookZoom){ toast(nz===1?'هذا حجم المصحف الأصلي':'هذا أكبر حجم'); return } const an = pageAnchor(); bookZoom = nz; ls.set('bookZoom', bookZoom); setupBook(cat, an); toast(bookZoom>1?`حجم الخط ${AR(Math.round(bookZoom*100))}٪`:'صفحات المصحف الأصلية'); return }
      S.qSize = Math.max(18, Math.min(40, S.qSize + (a==='qPlus'?2:-2))); saveS(); applyTheme(); return }
    if (a==='pgNext'){ flip('next'); return }
    if (a==='pgPrev'){ flip('prev'); return }
    if (a==='goMark'){
      const m = marks[cat]; if (!m){ toast('لا توجد علامة بعد. اضغط على آية لحفظها'); return }
      if (book){ const key = `${SURAH[cat].sura}:${m}`; const idx = BK.pages.findIndex(d=>d.f ? d.w.some(i=>FLOW.words[i][0]===key) : MUSHAF.pages[d.p].some(l=>l.w&&l.w.some(w=>w[0]===key)));
        if (idx>=0 && idx!==BK.i){ BK.i = idx; renderPage(BK.front, idx).then(showPage) } return }
      document.querySelector('.ayah.mark')?.scrollIntoView({behavior:'smooth',block:'center'}); return }
    if (a==='auto'){ autoRAF ? stopAuto() : startAuto(); return }
    const spd = t.closest('[data-speed]'); if (spd){ autoSpeed = +spd.dataset.speed; document.querySelectorAll('[data-speed]').forEach(b=>b.setAttribute('aria-pressed', b===spd)); return }
    if (a==='wake'){ toggleWake(t.closest('#wake')); return }
    if (S.reader!=='book'){
      const ay = t.closest('[data-ayah]');
      if (ay){ if (lpFired){ lpFired = false; return } toggleMark(cat, +ay.dataset.ayah); return }
    }
  }
});
app.addEventListener('keydown', e => { if ((e.key==='Enter'||e.key===' ') && e.target.matches('[data-card]')){ e.preventDefault(); tap(route(), +e.target.dataset.card) } });
addEventListener('keydown', e => { if (e.key==='Escape'){ if (!beadsEl.hidden) closeBeads(); else if (sheetOpen) closeSheet() } });
async function toggleWake(btn){
  if (wakeLock){ try{ await wakeLock.release() }catch(e){} wakeLock = null; btn.setAttribute('aria-pressed','false'); toast('أُلغي تثبيت الشاشة'); return }
  try{
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', ()=>{ wakeLock = null; const b = document.getElementById('wake'); if (b) b.setAttribute('aria-pressed','false') });
    btn.setAttribute('aria-pressed','true'); toast('الشاشة لن تنطفئ أثناء القراءة');
  }catch(e){ toast('تثبيت الشاشة يعمل في التطبيق المثبّت على الهاتف') }
}
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', ()=>{ if (S.theme==='system') render(true) });

"564":{"s":"الملك","j":29}},"kahf":["ٱلْحَمْدُ لِلَّهِ ٱلَّذِىٓ أَنزَلَ عَلَىٰ عَبْدِهِ ٱلْكِتَـٰبَ وَلَمْ يَجْعَل لَّهُۥ عِوَجَاۜ","قَيِّمًۭا لِّيُنذِرَ بَأْسًۭا شَدِيدًۭا مِّن لَّدُنْهُ وَيُبَشِّرَ ٱلْمُؤْمِنِينَ ٱلَّذِينَ يَعْمَلُونَ ٱلصَّـٰلِحَـٰتِ أَنَّ لَهُمْ أَجْرًا حَسَنًۭا","مَّـٰكِثِينَ فِيهِ أَبَدًۭا","وَيُنذِرَ ٱلَّذِينَ قَالُوا۟ ٱتَّخَذَ ٱللَّهُ وَلَدًۭا","مَّا لَهُم بِهِۦ مِنْ عِلْمٍۢ وَلَا لِـَٔابَآئِهِمْ ۚ كَبُرَتْ كَلِمَةًۭ تَخْرُجُ مِنْ أَفْوَٰهِهِمْ ۚ إِن يَقُولُونَ إِلَّا كَذِبًۭا","فَلَعَلَّكَ بَـٰخِعٌۭ نَّفْسَكَ عَلَىٰٓ ءَاثَـٰرِهِمْ إِن لَّمْ يُؤْمِنُوا۟ بِهَـٰذَا ٱلْحَدِيثِ أَسَفًا","إِنَّا جَعَلْنَا مَا عَلَى ٱلْأَرْضِ زِينَةًۭ لَّهَا لِنَبْلُوَهُمْ أَيُّهُمْ أَحْسَنُ عَمَلًۭا","وَإِنَّا لَجَـٰعِلُونَ مَا عَلَيْهَا صَعِيدًۭا جُرُزًا","أَمْ حَسِبْتَ أَنَّ أَصْحَـٰبَ ٱلْكَهْفِ وَٱلرَّقِيمِ كَانُوا۟ مِنْ ءَايَـٰتِنَا عَجَبًا","إِذْ أَوَى ٱلْفِتْيَةُ إِلَى ٱلْكَهْفِ فَقَالُوا۟ رَبَّنَآ ءَاتِنَا مِن لَّدُنكَ رَحْمَةًۭ وَهَيِّئْ لَنَا مِنْ أَمْرِنَا رَشَدًۭا","فَضَرَبْنَا عَلَىٰٓ ءَاذَانِهِمْ فِى ٱلْكَهْفِ سِنِينَ عَدَدًۭا","ثُمَّ بَعَثْنَـٰهُمْ لِنَعْلَمَ أَىُّ ٱلْحِزْبَيْنِ أَحْصَىٰ لِمَا لَبِثُوٓا۟ أَمَدًۭا","نَّحْنُ نَقُصُّ عَلَيْكَ نَبَأَهُم بِٱلْحَقِّ ۚ إِنَّهُمْ فِتْيَةٌ ءَامَنُوا۟ بِرَبِّهِمْ وَزِدْنَـٰهُمْ هُدًۭى","وَرَبَطْنَا عَلَىٰ قُلُوبِهِمْ إِذْ قَامُوا۟ فَقَالُوا۟ رَبُّنَا رَبُّ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضِ لَن نَّدْعُوَا۟ مِن دُونِهِۦٓ إِلَـٰهًۭا ۖ لَّقَدْ قُلْنَآ إِذًۭا شَطَطًا","هَـٰٓؤُلَآءِ قَوْمُنَا ٱتَّخَذُوا۟ مِن دُونِهِۦٓ ءَالِهَةًۭ ۖ لَّوْلَا يَأْتُونَ عَلَيْهِم بِسُلْطَـٰنٍۭ بَيِّنٍۢ ۖ فَمَنْ أَظْلَمُ مِمَّنِ ٱفْتَرَىٰ عَلَى ٱللَّهِ كَذِبًۭا","وَإِذِ ٱعْتَزَلْتُمُوهُمْ وَمَا يَعْبُدُونَ إِلَّا ٱللَّهَ فَأْوُۥٓا۟ إِلَى ٱلْكَهْفِ يَنشُرْ لَكُمْ رَبُّكُم مِّن رَّحْمَتِهِۦ وَيُهَيِّئْ لَكُم مِّنْ أَمْرِكُم مِّرْفَقًۭا","۞ وَتَرَى ٱلشَّمْسَ إِذَا طَلَعَت تَّزَٰوَرُ عَن كَهْفِهِمْ ذَاتَ ٱلْيَمِينِ وَإِذَا غَرَبَت تَّقْرِضُهُمْ ذَاتَ ٱلشِّمَالِ وَهُمْ فِى فَجْوَةٍۢ مِّنْهُ ۚ ذَٰلِكَ مِنْ ءَايَـٰتِ ٱللَّهِ ۗ مَن يَهْدِ ٱللَّهُ فَهُوَ ٱلْمُهْتَدِ ۖ وَمَن يُضْلِلْ فَلَن تَجِدَ لَهُۥ وَلِيًّۭا مُّرْشِدًۭا","وَتَحْسَبُهُمْ أَيْقَاظًۭا وَهُمْ رُقُودٌۭ ۚ وَنُقَلِّبُهُمْ ذَاتَ ٱلْيَمِينِ وَذَاتَ ٱلشِّمَالِ ۖ وَكَلْبُهُم بَـٰسِطٌۭ ذِرَاعَيْهِ بِٱلْوَصِيدِ ۚ لَوِ ٱطَّلَعْتَ عَلَيْهِمْ لَوَلَّيْتَ مِنْهُمْ فِرَارًۭا وَلَمُلِئْتَ مِنْهُمْ رُعْبًۭا","وَكَذَٰلِكَ بَعَثْنَـٰهُمْ لِيَتَسَآءَلُوا۟ بَيْنَهُمْ ۚ قَالَ قَآئِلٌۭ مِّنْهُمْ كَمْ لَبِثْتُمْ ۖ قَالُوا۟ لَبِثْنَا يَوْمًا أَوْ بَعْضَ يَوْمٍۢ ۚ قَالُوا۟ رَبُّكُمْ أَعْلَمُ بِمَا لَبِثْتُمْ فَٱبْعَثُوٓا۟ أَحَدَكُم بِوَرِقِكُمْ هَـٰذِهِۦٓ إِلَى ٱلْمَدِينَةِ فَلْيَنظُرْ أَيُّهَآ أَزْكَىٰ طَعَامًۭا فَلْيَأْتِكُم بِرِزْقٍۢ مِّنْهُ وَلْيَتَلَطَّفْ وَلَا يُشْعِرَنَّ بِكُمْ أَحَدًا","إِنَّهُمْ إِن يَظْهَرُوا۟ عَلَيْكُمْ يَرْجُمُوكُمْ أَوْ يُعِيدُوكُمْ فِى مِلَّتِهِمْ وَلَن تُفْلِحُوٓا۟ إِذًا أَبَدًۭا","وَكَذَٰلِكَ أَعْثَرْنَا عَلَيْهِمْ لِيَعْلَمُوٓا۟ أَنَّ وَعْدَ ٱللَّهِ حَقٌّۭ وَأَنَّ ٱلسَّاعَةَ لَا رَيْبَ فِيهَآ إِذْ يَتَنَـٰزَعُونَ بَيْنَهُمْ أَمْرَهُمْ ۖ فَقَالُوا۟ ٱبْنُوا۟ عَلَيْهِم بُنْيَـٰنًۭا ۖ رَّبُّهُمْ أَعْلَمُ بِهِمْ ۚ قَالَ ٱلَّذِينَ غَلَبُوا۟ عَلَىٰٓ أَمْرِهِمْ لَنَتَّخِذَنَّ عَلَيْهِم مَّسْجِدًۭا","سَيَقُولُونَ ثَلَـٰثَةٌۭ رَّابِعُهُمْ كَلْبُهُمْ وَيَقُولُونَ خَمْسَةٌۭ سَادِسُهُمْ كَلْبُهُمْ رَجْمًۢا بِٱلْغَيْبِ ۖ وَيَقُولُونَ سَبْعَةٌۭ وَثَامِنُهُمْ كَلْبُهُمْ ۚ قُل رَّبِّىٓ أَعْلَمُ بِعِدَّتِهِم مَّا يَعْلَمُهُمْ إِلَّا قَلِيلٌۭ ۗ فَلَا تُمَارِ فِيهِمْ إِلَّا مِرَآءًۭ ظَـٰهِرًۭا وَلَا تَسْتَفْتِ فِيهِم مِّنْهُمْ أَحَدًۭا","وَلَا تَقُولَنَّ لِشَا۟ىْءٍ إِنِّى فَاعِلٌۭ ذَٰلِكَ غَدًا","إِلَّآ أَن يَشَآءَ ٱللَّهُ ۚ وَٱذْكُر رَّبَّكَ إِذَا نَسِيتَ وَقُلْ عَسَىٰٓ أَن يَهْدِيَنِ رَبِّى لِأَقْرَبَ مِنْ هَـٰذَا رَشَدًۭا","وَلَبِثُوا۟ فِى كَهْفِهِمْ ثَلَـٰثَ مِا۟ئَةٍۢ سِنِينَ وَٱزْدَادُوا۟ تِسْعًۭا","قُلِ ٱللَّهُ أَعْلَمُ بِمَا لَبِثُوا۟ ۖ لَهُۥ غَيْبُ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضِ ۖ أَبْصِرْ بِهِۦ وَأَسْمِعْ ۚ مَا لَهُم مِّن دُونِهِۦ مِن وَلِىٍّۢ وَلَا يُشْرِكُ فِى حُكْمِهِۦٓ أَحَدًۭا","وَٱتْلُ مَآ أُوحِىَ إِلَيْكَ مِن كِتَابِ رَبِّكَ ۖ لَا مُبَدِّلَ لِكَلِمَـٰتِهِۦ وَلَن تَجِدَ مِن دُونِهِۦ مُلْتَحَدًۭا","وَٱصْبِرْ نَفْسَكَ مَعَ ٱلَّذِينَ يَدْعُونَ رَبَّهُم بِٱلْغَدَوٰةِ وَٱلْعَشِىِّ يُرِيدُونَ وَجْهَهُۥ ۖ وَلَا تَعْدُ عَيْنَاكَ عَنْهُمْ تُرِيدُ زِينَةَ ٱلْحَيَوٰةِ ٱلدُّنْيَا ۖ وَلَا تُطِعْ مَنْ أَغْفَلْنَا قَلْبَهُۥ عَن ذِكْرِنَا وَٱتَّبَعَ هَوَىٰهُ وَكَانَ أَمْرُهُۥ فُرُطًۭا","وَقُلِ ٱلْحَقُّ مِن رَّبِّكُمْ ۖ فَمَن شَآءَ فَلْيُؤْمِن وَمَن شَآءَ فَلْيَكْفُرْ ۚ إِنَّآ أَعْتَدْنَا لِلظَّـٰلِمِينَ نَارًا أَحَاطَ بِهِمْ سُرَادِقُهَا ۚ وَإِن يَسْتَغِيثُوا۟ يُغَاثُوا۟ بِمَآءٍۢ كَٱلْمُهْلِ يَشْوِى ٱلْوُجُوهَ ۚ بِئْسَ ٱلشَّرَابُ وَسَآءَتْ مُرْتَفَقًا","إِنَّ ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّـٰلِحَـٰتِ إِنَّا لَا نُضِيعُ أَجْرَ مَنْ أَحْسَنَ عَمَلًا","أُو۟لَـٰٓئِكَ لَهُمْ جَنَّـٰتُ عَدْنٍۢ تَجْرِى مِن تَحْتِهِمُ ٱلْأَنْهَـٰرُ يُحَلَّوْنَ فِيهَا مِنْ أَسَاوِرَ مِن ذَهَبٍۢ وَيَلْبَسُونَ ثِيَابًا خُضْرًۭا مِّن سُندُسٍۢ وَإِسْتَبْرَقٍۢ مُّتَّكِـِٔينَ فِيهَا عَلَى ٱلْأَرَآئِكِ ۚ نِعْمَ ٱلثَّوَابُ وَحَسُنَتْ مُرْتَفَقًۭا","۞ وَٱضْرِبْ لَهُم مَّثَلًۭا رَّجُلَيْنِ جَعَلْنَا لِأَحَدِهِمَا جَنَّتَيْنِ مِنْ أَعْنَـٰبٍۢ وَحَفَفْنَـٰهُمَا بِنَخْلٍۢ وَجَعَلْنَا بَيْنَهُمَا زَرْعًۭا","كِلْتَا ٱلْجَنَّتَيْنِ ءَاتَتْ أُكُلَهَا وَلَمْ تَظْلِم مِّنْهُ شَيْـًۭٔا ۚ وَفَجَّرْنَا خِلَـٰلَهُمَا نَهَرًۭا","وَكَانَ لَهُۥ ثَمَرٌۭ فَقَالَ لِصَـٰحِبِهِۦ وَهُوَ يُحَاوِرُهُۥٓ أَنَا۠ أَكْثَرُ مِنكَ مَالًۭا وَأَعَزُّ نَفَرًۭا","وَدَخَلَ جَنَّتَهُۥ وَهُوَ ظَالِمٌۭ لِّنَفْسِهِۦ قَالَ مَآ أَظُنُّ أَن تَبِيدَ هَـٰذِهِۦٓ أَبَدًۭا","وَمَآ أَظُنُّ ٱلسَّاعَةَ قَآئِمَةًۭ وَلَئِن رُّدِدتُّ إِلَىٰ رَبِّى لَأَجِدَنَّ خَيْرًۭا مِّنْهَا مُنقَلَبًۭا","قَالَ لَهُۥ صَاحِبُهُۥ وَهُوَ يُحَاوِرُهُۥٓ أَكَفَرْتَ بِٱلَّذِى خَلَقَكَ مِن تُرَابٍۢ ثُمَّ مِن نُّطْفَةٍۢ ثُمَّ سَوَّىٰكَ رَجُلًۭا","لَّـٰكِنَّا۠ هُوَ ٱللَّهُ رَبِّى وَلَآ أُشْرِكُ بِرَبِّىٓ أَحَدًۭا","وَلَوْلَآ إِذْ دَخَلْتَ جَنَّتَكَ قُلْتَ مَا شَآءَ ٱللَّهُ لَا قُوَّةَ إِلَّا بِٱللَّهِ ۚ إِن تَرَنِ أَنَا۠ أَقَلَّ مِنكَ مَالًۭا وَوَلَدًۭا","فَعَسَىٰ رَبِّىٓ أَن يُؤْتِيَنِ خَيْرًۭا مِّن جَنَّتِكَ وَيُرْسِلَ عَلَيْهَا حُسْبَانًۭا مِّنَ ٱلسَّمَآءِ فَتُصْبِحَ صَعِيدًۭا زَلَقًا","أَوْ يُصْبِحَ مَآؤُهَا غَوْرًۭا فَلَن تَسْتَطِيعَ لَهُۥ طَلَبًۭا","وَأُحِيطَ بِثَمَرِهِۦ فَأَصْبَحَ يُقَلِّبُ كَفَّيْهِ عَلَىٰ مَآ أَنفَقَ فِيهَا وَهِىَ خَاوِيَةٌ عَلَىٰ عُرُوشِهَا وَيَقُولُ يَـٰلَيْتَنِى لَمْ أُشْرِكْ بِرَبِّىٓ أَحَدًۭا","وَلَمْ تَكُن لَّهُۥ فِئَةٌۭ يَنصُرُونَهُۥ مِن دُونِ ٱللَّهِ وَمَا كَانَ مُنتَصِرًا","هُنَالِكَ ٱلْوَلَـٰيَةُ لِلَّهِ ٱلْحَقِّ ۚ هُوَ خَيْرٌۭ ثَوَابًۭا وَخَيْرٌ عُقْبًۭا","وَٱضْرِبْ لَهُم مَّثَلَ ٱلْحَيَوٰةِ ٱلدُّنْيَا كَمَآءٍ أَنزَلْنَـٰهُ مِنَ ٱلسَّمَآءِ فَٱخْتَلَطَ بِهِۦ نَبَاتُ ٱلْأَرْضِ فَأَصْبَحَ هَشِيمًۭا تَذْرُوهُ ٱلرِّيَـٰحُ ۗ وَكَانَ ٱللَّهُ عَلَىٰ كُلِّ شَىْءٍۢ مُّقْتَدِرًا","ٱلْمَالُ وَٱلْبَنُونَ زِينَةُ ٱلْحَيَوٰةِ ٱلدُّنْيَا ۖ وَٱلْبَـٰقِيَـٰتُ ٱلصَّـٰلِحَـٰتُ خَيْرٌ عِندَ رَبِّكَ ثَوَابًۭا وَخَيْرٌ أَمَلًۭا","وَيَوْمَ نُسَيِّرُ ٱلْجِبَالَ وَتَرَى ٱلْأَرْضَ بَارِزَةًۭ وَحَشَرْنَـٰهُمْ فَلَمْ نُغَادِرْ مِنْهُمْ أَحَدًۭا","وَعُرِضُوا۟ عَلَىٰ رَبِّكَ صَفًّۭا لَّقَدْ جِئْتُمُونَا كَمَا خَلَقْنَـٰكُمْ أَوَّلَ مَرَّةٍۭ ۚ بَلْ زَعَمْتُمْ أَلَّن نَّجْعَلَ لَكُم مَّوْعِدًۭا","وَوُضِعَ ٱلْكِتَـٰبُ فَتَرَى ٱلْمُجْرِمِينَ مُشْفِقِينَ مِمَّا فِيهِ وَيَقُولُونَ يَـٰوَيْلَتَنَا مَالِ هَـٰذَا ٱلْكِتَـٰبِ لَا يُغَادِرُ صَغِيرَةًۭ وَلَا كَبِيرَةً إِلَّآ أَحْصَىٰهَا ۚ وَوَجَدُوا۟ مَا عَمِلُوا۟ حَاضِرًۭا ۗ وَلَا يَظْلِمُ رَبُّكَ أَحَدًۭا","وَإِذْ قُلْنَا لِلْمَلَـٰٓئِكَةِ ٱسْجُدُوا۟ لِـَٔادَمَ فَسَجَدُوٓا۟ إِلَّآ إِبْلِيسَ كَانَ مِنَ ٱلْجِنِّ فَفَسَقَ عَنْ أَمْرِ رَبِّهِۦٓ ۗ أَفَتَتَّخِذُونَهُۥ وَذُرِّيَّتَهُۥٓ أَوْلِيَآءَ مِن دُونِى وَهُمْ لَكُمْ عَدُوٌّۢ ۚ بِئْسَ لِلظَّـٰلِمِينَ بَدَلًۭا","۞ مَّآ أَشْهَدتُّهُمْ خَلْقَ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضِ وَلَا خَلْقَ أَنفُسِهِمْ وَمَا كُنتُ مُتَّخِذَ ٱلْمُضِلِّينَ عَضُدًۭا","وَيَوْمَ يَقُولُ نَادُوا۟ شُرَكَآءِىَ ٱلَّذِينَ زَعَمْتُمْ فَدَعَوْهُمْ فَلَمْ يَسْتَجِيبُوا۟ لَهُمْ وَجَعَلْنَا بَيْنَهُم مَّوْبِقًۭا","وَرَءَا ٱلْمُجْرِمُونَ ٱلنَّارَ فَظَنُّوٓا۟ أَنَّهُم مُّوَاقِعُوهَا وَلَمْ يَجِدُوا۟ عَنْهَا مَصْرِفًۭا","وَلَقَدْ صَرَّفْنَا فِى هَـٰذَا ٱلْقُرْءَانِ لِلنَّاسِ مِن كُلِّ مَثَلٍۢ ۚ وَكَانَ ٱلْإِنسَـٰنُ أَكْثَرَ شَىْءٍۢ جَدَلًۭا","وَمَا مَنَعَ ٱلنَّاسَ أَن يُؤْمِنُوٓا۟ إِذْ جَآءَهُمُ ٱلْهُدَىٰ وَيَسْتَغْفِرُوا۟ رَبَّهُمْ إِلَّآ أَن تَأْتِيَهُمْ سُنَّةُ ٱلْأَوَّلِينَ أَوْ يَأْتِيَهُمُ ٱلْعَذَابُ قُبُلًۭا","وَمَا نُرْسِلُ ٱلْمُرْسَلِينَ إِلَّا مُبَشِّرِينَ وَمُنذِرِينَ ۚ وَيُجَـٰدِلُ ٱلَّذِينَ كَفَرُوا۟ بِٱلْبَـٰطِلِ لِيُدْحِضُوا۟ بِهِ ٱلْحَقَّ ۖ وَٱتَّخَذُوٓا۟ ءَايَـٰتِى وَمَآ أُنذِرُوا۟ هُزُوًۭا","وَمَنْ أَظْلَمُ مِمَّن ذُكِّرَ بِـَٔايَـٰتِ رَبِّهِۦ فَأَعْرَضَ عَنْهَا وَنَسِىَ مَا قَدَّمَتْ يَدَاهُ ۚ إِنَّا جَعَلْنَا عَلَىٰ قُلُوبِهِمْ أَكِنَّةً أَن يَفْقَهُوهُ وَفِىٓ ءَاذَانِهِمْ وَقْرًۭا ۖ وَإِن تَدْعُهُمْ إِلَى ٱلْهُدَىٰ فَلَن يَهْتَدُوٓا۟ إِذًا أَبَدًۭا","وَرَبُّكَ ٱلْغَفُورُ ذُو ٱلرَّحْمَةِ ۖ لَوْ يُؤَاخِذُهُم بِمَا كَسَبُوا۟ لَعَجَّلَ لَهُمُ ٱلْعَذَابَ ۚ بَل لَّهُم مَّوْعِدٌۭ لَّن يَجِدُوا۟ مِن دُونِهِۦ مَوْئِلًۭا","وَتِلْكَ ٱلْقُرَىٰٓ أَهْلَكْنَـٰهُمْ لَمَّا ظَلَمُوا۟ وَجَعَلْنَا لِمَهْلِكِهِم مَّوْعِدًۭا","وَإِذْ قَالَ مُوسَىٰ لِفَتَىٰهُ لَآ أَبْرَحُ حَتَّىٰٓ أَبْلُغَ مَجْمَعَ ٱلْبَحْرَيْنِ أَوْ أَمْضِىَ حُقُبًۭا","فَلَمَّا بَلَغَا مَجْمَعَ بَيْنِهِمَا نَسِيَا حُوتَهُمَا فَٱتَّخَذَ سَبِيلَهُۥ فِى ٱلْبَحْرِ سَرَبًۭا","فَلَمَّا جَاوَزَا قَالَ لِفَتَىٰهُ ءَاتِنَا غَدَآءَنَا لَقَدْ لَقِينَا مِن سَفَرِنَا هَـٰذَا نَصَبًۭا","قَالَ أَرَءَيْتَ إِذْ أَوَيْنَآ إِلَى ٱلصَّخْرَةِ فَإِنِّى نَسِيتُ ٱلْحُوتَ وَمَآ أَنسَىٰنِيهُ إِلَّا ٱلشَّيْطَـٰنُ أَنْ أَذْكُرَهُۥ ۚ وَٱتَّخَذَ سَبِيلَهُۥ فِى ٱلْبَحْرِ عَجَبًۭا","قَالَ ذَٰلِكَ مَا كُنَّا نَبْغِ ۚ فَٱرْتَدَّا عَلَىٰٓ ءَاثَارِهِمَا قَصَصًۭا","فَوَجَدَا عَبْدًۭا مِّنْ عِبَادِنَآ ءَاتَيْنَـٰهُ رَحْمَةًۭ مِّنْ عِندِنَا وَعَلَّمْنَـٰهُ مِن لَّدُنَّا عِلْمًۭا","قَالَ لَهُۥ مُوسَىٰ هَلْ أَتَّبِعُكَ عَلَىٰٓ أَن تُعَلِّمَنِ مِمَّا عُلِّمْتَ رُشْدًۭا","قَالَ إِنَّكَ لَن تَسْتَطِيعَ مَعِىَ صَبْرًۭا","وَكَيْفَ تَصْبِرُ عَلَىٰ مَا لَمْ تُحِطْ بِهِۦ خُبْرًۭا","قَالَ سَتَجِدُنِىٓ إِن شَآءَ ٱللَّهُ صَابِرًۭا وَلَآ أَعْصِى لَكَ أَمْرًۭا","قَالَ فَإِنِ ٱتَّبَعْتَنِى فَلَا تَسْـَٔلْنِى عَن شَىْءٍ حَتَّىٰٓ أُحْدِثَ لَكَ مِنْهُ ذِكْرًۭا","فَٱنطَلَقَا حَتَّىٰٓ إِذَا رَكِبَا فِى ٱلسَّفِينَةِ خَرَقَهَا ۖ قَالَ أَخَرَقْتَهَا لِتُغْرِقَ أَهْلَهَا لَقَدْ جِئْتَ شَيْـًٔا إِمْرًۭا","قَالَ أَلَمْ أَقُلْ إِنَّكَ لَن تَسْتَطِيعَ مَعِىَ صَبْرًۭا","قَالَ لَا تُؤَاخِذْنِى بِمَا نَسِيتُ وَلَا تُرْهِقْنِى مِنْ أَمْرِى عُسْرًۭا","فَٱنطَلَقَا حَتَّىٰٓ إِذَا لَقِيَا غُلَـٰمًۭا فَقَتَلَهُۥ قَالَ أَقَتَلْتَ نَفْسًۭا زَكِيَّةًۢ بِغَيْرِ نَفْسٍۢ لَّقَدْ جِئْتَ شَيْـًۭٔا نُّكْرًۭا","۞ قَالَ أَلَمْ أَقُل لَّكَ إِنَّكَ لَن تَسْتَطِيعَ مَعِىَ صَبْرًۭا","قَالَ إِن سَأَلْتُكَ عَن شَىْءٍۭ بَعْدَهَا فَلَا تُصَـٰحِبْنِى ۖ قَدْ بَلَغْتَ مِن لَّدُنِّى عُذْرًۭا","فَٱنطَلَقَا حَتَّىٰٓ إِذَآ أَتَيَآ أَهْلَ قَرْيَةٍ ٱسْتَطْعَمَآ أَهْلَهَا فَأَبَوْا۟ أَن يُضَيِّفُوهُمَا فَوَجَدَا فِيهَا جِدَارًۭا يُرِيدُ أَن يَنقَضَّ فَأَقَامَهُۥ ۖ قَالَ لَوْ شِئْتَ لَتَّخَذْتَ عَلَيْهِ أَجْرًۭا","قَالَ هَـٰذَا فِرَاقُ بَيْنِى وَبَيْنِكَ ۚ سَأُنَبِّئُكَ بِتَأْوِيلِ مَا لَمْ تَسْتَطِع عَّلَيْهِ صَبْرًا","أَمَّا ٱلسَّفِينَةُ فَكَانَتْ لِمَسَـٰكِينَ يَعْمَلُونَ فِى ٱلْبَحْرِ فَأَرَدتُّ أَنْ أَعِيبَهَا وَكَانَ وَرَآءَهُم مَّلِكٌۭ يَأْخُذُ كُلَّ سَفِينَةٍ غَصْبًۭا","وَأَمَّا ٱلْغُلَـٰمُ فَكَانَ أَبَوَاهُ مُؤْمِنَيْنِ فَخَشِينَآ أَن يُرْهِقَهُمَا طُغْيَـٰنًۭا وَكُفْرًۭا","فَأَرَدْنَآ أَن يُبْدِلَهُمَا رَبُّهُمَا خَيْرًۭا مِّنْهُ زَكَوٰةًۭ وَأَقْرَبَ رُحْمًۭا","وَأَمَّا ٱلْجِدَارُ فَكَانَ لِغُلَـٰمَيْنِ يَتِيمَيْنِ فِى ٱلْمَدِينَةِ وَكَانَ تَحْتَهُۥ كَنزٌۭ لَّهُمَا وَكَانَ أَبُوهُمَا صَـٰلِحًۭا فَأَرَادَ رَبُّكَ أَن يَبْلُغَآ أَشُدَّهُمَا وَيَسْتَخْرِجَا كَنزَهُمَا رَحْمَةًۭ مِّن رَّبِّكَ ۚ وَمَا فَعَلْتُهُۥ عَنْ أَمْرِى ۚ ذَٰلِكَ تَأْوِيلُ مَا لَمْ تَسْطِع عَّلَيْهِ صَبْرًۭا","وَيَسْـَٔلُونَكَ عَن ذِى ٱلْقَرْنَيْنِ ۖ قُلْ سَأَتْلُوا۟ عَلَيْكُم مِّنْهُ ذِكْرًا","إِنَّا مَكَّنَّا لَهُۥ فِى ٱلْأَرْضِ وَءَاتَيْنَـٰهُ مِن كُلِّ شَىْءٍۢ سَبَبًۭا","فَأَتْبَعَ سَبَبًا","حَتَّىٰٓ إِذَا بَلَغَ مَغْرِبَ ٱلشَّمْسِ وَجَدَهَا تَغْرُبُ فِى عَيْنٍ حَمِئَةٍۢ وَوَجَدَ عِندَهَا قَوْمًۭا ۗ قُلْنَا يَـٰذَا ٱلْقَرْنَيْنِ إِمَّآ أَن تُعَذِّبَ وَإِمَّآ أَن تَتَّخِذَ فِيهِمْ حُسْنًۭا","قَالَ أَمَّا مَن ظَلَمَ فَسَوْفَ نُعَذِّبُهُۥ ثُمَّ يُرَدُّ إِلَىٰ رَبِّهِۦ فَيُعَذِّبُهُۥ عَذَابًۭا نُّكْرًۭا","وَأَمَّا مَنْ ءَامَنَ وَعَمِلَ صَـٰلِحًۭا فَلَهُۥ جَزَآءً ٱلْحُسْنَىٰ ۖ وَسَنَقُولُ لَهُۥ مِنْ أَمْرِنَا يُسْرًۭا","ثُمَّ أَتْبَعَ سَبَبًا","حَتَّىٰٓ إِذَا بَلَغَ مَطْلِعَ ٱلشَّمْسِ وَجَدَهَا تَطْلُعُ عَلَىٰ قَوْمٍۢ لَّمْ نَجْعَل لَّهُم مِّن دُونِهَا سِتْرًۭا","كَذَٰلِكَ وَقَدْ أَحَطْنَا بِمَا لَدَيْهِ خُبْرًۭا","ثُمَّ أَتْبَعَ سَبَبًا","حَتَّىٰٓ إِذَا بَلَغَ بَيْنَ ٱلسَّدَّيْنِ وَجَدَ مِن دُونِهِمَا قَوْمًۭا لَّا يَكَادُونَ يَفْقَهُونَ قَوْلًۭا","قَالُوا۟ يَـٰذَا ٱلْقَرْنَيْنِ إِنَّ يَأْجُوجَ وَمَأْجُوجَ مُفْسِدُونَ فِى ٱلْأَرْضِ فَهَلْ نَجْعَلُ لَكَ خَرْجًا عَلَىٰٓ أَن تَجْعَلَ بَيْنَنَا وَبَيْنَهُمْ سَدًّۭا","قَالَ مَا مَكَّنِّى فِيهِ رَبِّى خَيْرٌۭ فَأَعِينُونِى بِقُوَّةٍ أَجْعَلْ بَيْنَكُمْ وَبَيْنَهُمْ رَدْمًا","ءَاتُونِى زُبَرَ ٱلْحَدِيدِ ۖ حَتَّىٰٓ إِذَا سَاوَىٰ بَيْنَ ٱلصَّدَفَيْنِ قَالَ ٱنفُخُوا۟ ۖ حَتَّىٰٓ إِذَا جَعَلَهُۥ نَارًۭا قَالَ ءَاتُونِىٓ أُفْرِغْ عَلَيْهِ قِطْرًۭا","فَمَا ٱسْطَـٰعُوٓا۟ أَن يَظْهَرُوهُ وَمَا ٱسْتَطَـٰعُوا۟ لَهُۥ نَقْبًۭا","قَالَ هَـٰذَا رَحْمَةٌۭ مِّن رَّبِّى ۖ فَإِذَا جَآءَ وَعْدُ رَبِّى جَعَلَهُۥ دَكَّآءَ ۖ وَكَانَ وَعْدُ رَبِّى حَقًّۭا","۞ وَتَرَكْنَا بَعْضَهُمْ يَوْمَئِذٍۢ يَمُوجُ فِى بَعْضٍۢ ۖ وَنُفِخَ فِى ٱلصُّورِ فَجَمَعْنَـٰهُمْ جَمْعًۭا","وَعَرَضْنَا جَهَنَّمَ يَوْمَئِذٍۢ لِّلْكَـٰفِرِينَ عَرْضًا","ٱلَّذِينَ كَانَتْ أَعْيُنُهُمْ فِى غِطَآءٍ عَن ذِكْرِى وَكَانُوا۟ لَا يَسْتَطِيعُونَ سَمْعًا","أَفَحَسِبَ ٱلَّذِينَ كَفَرُوٓا۟ أَن يَتَّخِذُوا۟ عِبَادِى مِن دُونِىٓ أَوْلِيَآءَ ۚ إِنَّآ أَعْتَدْنَا جَهَنَّمَ لِلْكَـٰفِرِينَ نُزُلًۭا","قُلْ هَلْ نُنَبِّئُكُم بِٱلْأَخْسَرِينَ أَعْمَـٰلًا","ٱلَّذِينَ ضَلَّ سَعْيُهُمْ فِى ٱلْحَيَوٰةِ ٱلدُّنْيَا وَهُمْ يَحْسَبُونَ أَنَّهُمْ يُحْسِنُونَ صُنْعًا","أُو۟لَـٰٓئِكَ ٱلَّذِينَ كَفَرُوا۟ بِـَٔايَـٰتِ رَبِّهِمْ وَلِقَآئِهِۦ فَحَبِطَتْ أَعْمَـٰلُهُمْ فَلَا نُقِيمُ لَهُمْ يَوْمَ ٱلْقِيَـٰمَةِ وَزْنًۭا","ذَٰلِكَ جَزَآؤُهُمْ جَهَنَّمُ بِمَا كَفَرُوا۟ وَٱتَّخَذُوٓا۟ ءَايَـٰتِى وَرُسُلِى هُزُوًا","إِنَّ ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّـٰلِحَـٰتِ كَانَتْ لَهُمْ جَنَّـٰتُ ٱلْفِرْدَوْسِ نُزُلًا","خَـٰلِدِينَ فِيهَا لَا يَبْغُونَ عَنْهَا حِوَلًۭا","قُل لَّوْ كَانَ ٱلْبَحْرُ مِدَادًۭا لِّكَلِمَـٰتِ رَبِّى لَنَفِدَ ٱلْبَحْرُ قَبْلَ أَن تَنفَدَ كَلِمَـٰتُ رَبِّى وَلَوْ جِئْنَا بِمِثْلِهِۦ مَدَدًۭا","قُلْ إِنَّمَآ أَنَا۠ بَشَرٌۭ مِّثْلُكُمْ يُوحَىٰٓ إِلَىَّ أَنَّمَآ إِلَـٰهُكُمْ إِلَـٰهٌۭ وَٰحِدٌۭ ۖ فَمَن كَانَ يَرْجُوا۟ لِقَآءَ رَبِّهِۦ فَلْيَعْمَلْ عَمَلًۭا صَـٰلِحًۭا وَلَا يُشْرِكْ بِعِبَادَةِ رَبِّهِۦٓ أَحَدًۢا"],"mulk":["تَبَـٰرَكَ ٱلَّذِى بِيَدِهِ ٱلْمُلْكُ وَهُوَ عَلَىٰ كُلِّ شَىْءٍۢ قَدِيرٌ","ٱلَّذِى خَلَقَ ٱلْمَوْتَ وَٱلْحَيَوٰةَ لِيَبْلُوَكُمْ أَيُّكُمْ أَحْسَنُ عَمَلًۭا ۚ وَهُوَ ٱلْعَزِيزُ ٱلْغَفُورُ","ٱلَّذِى خَلَقَ سَبْعَ سَمَـٰوَٰتٍۢ طِبَاقًۭا ۖ مَّا تَرَىٰ فِى خَلْقِ ٱلرَّحْمَـٰنِ مِن تَفَـٰوُتٍۢ ۖ فَٱرْجِعِ ٱلْبَصَرَ هَلْ تَرَىٰ مِن فُطُورٍۢ","ثُمَّ ٱرْجِعِ ٱلْبَصَرَ كَرَّتَيْنِ يَنقَلِبْ إِلَيْكَ ٱلْبَصَرُ خَاسِئًۭا وَهُوَ حَسِيرٌۭ","وَلَقَدْ زَيَّنَّا ٱلسَّمَآءَ ٱلدُّنْيَا بِمَصَـٰبِيحَ وَجَعَلْنَـٰهَا رُجُومًۭا لِّلشَّيَـٰطِينِ ۖ وَأَعْتَدْنَا لَهُمْ عَذَابَ ٱلسَّعِيرِ","وَلِلَّذِينَ كَفَرُوا۟ بِرَبِّهِمْ عَذَابُ جَهَنَّمَ ۖ وَبِئْسَ ٱلْمَصِيرُ","إِذَآ أُلْقُوا۟ فِيهَا سَمِعُوا۟ لَهَا شَهِيقًۭا وَهِىَ تَفُورُ","تَكَادُ تَمَيَّزُ مِنَ ٱلْغَيْظِ ۖ كُلَّمَآ أُلْقِىَ فِيهَا فَوْجٌۭ سَأَلَهُمْ خَزَنَتُهَآ أَلَمْ يَأْتِكُمْ نَذِيرٌۭ","قَالُوا۟ بَلَىٰ قَدْ جَآءَنَا نَذِيرٌۭ فَكَذَّبْنَا وَقُلْنَا مَا نَزَّلَ ٱللَّهُ مِن شَىْءٍ إِنْ أَنتُمْ إِلَّا فِى ضَلَـٰلٍۢ كَبِيرٍۢ","وَقَالُوا۟ لَوْ كُنَّا نَسْمَعُ أَوْ نَعْقِلُ مَا كُنَّا فِىٓ أَصْحَـٰبِ ٱلسَّعِيرِ","فَٱعْتَرَفُوا۟ بِذَنۢبِهِمْ فَسُحْقًۭا لِّأَصْحَـٰبِ ٱلسَّعِيرِ","إِنَّ ٱلَّذِينَ يَخْشَوْنَ رَبَّهُم بِٱلْغَيْبِ لَهُم مَّغْفِرَةٌۭ وَأَجْرٌۭ كَبِيرٌۭ","وَأَسِرُّوا۟ قَوْلَكُمْ أَوِ ٱجْهَرُوا۟ بِهِۦٓ ۖ إِنَّهُۥ عَلِيمٌۢ بِذَاتِ ٱلصُّدُورِ","أَلَا يَعْلَمُ مَنْ خَلَقَ وَهُوَ ٱللَّطِيفُ ٱلْخَبِيرُ","هُوَ ٱلَّذِى جَعَلَ لَكُمُ ٱلْأَرْضَ ذَلُولًۭا فَٱمْشُوا۟ فِى مَنَاكِبِهَا وَكُلُوا۟ مِن رِّزْقِهِۦ ۖ وَإِلَيْهِ ٱلنُّشُورُ","ءَأَمِنتُم مَّن فِى ٱلسَّمَآءِ أَن يَخْسِفَ بِكُمُ ٱلْأَرْضَ فَإِذَا هِىَ تَمُورُ","أَمْ أَمِنتُم مَّن فِى ٱلسَّمَآءِ أَن يُرْسِلَ عَلَيْكُمْ حَاصِبًۭا ۖ فَسَتَعْلَمُونَ كَيْفَ نَذِيرِ","وَلَقَدْ كَذَّبَ ٱلَّذِينَ مِن قَبْلِهِمْ فَكَيْفَ كَانَ نَكِيرِ","أَوَلَمْ يَرَوْا۟ إِلَى ٱلطَّيْرِ فَوْقَهُمْ صَـٰٓفَّـٰتٍۢ وَيَقْبِضْنَ ۚ مَا يُمْسِكُهُنَّ إِلَّا ٱلرَّحْمَـٰنُ ۚ إِنَّهُۥ بِكُلِّ شَىْءٍۭ بَصِيرٌ","أَمَّنْ هَـٰذَا ٱلَّذِى هُوَ جُندٌۭ لَّكُمْ يَنصُرُكُم مِّن دُونِ ٱلرَّحْمَـٰنِ ۚ إِنِ ٱلْكَـٰفِرُونَ إِلَّا فِى غُرُورٍ","أَمَّنْ هَـٰذَا ٱلَّذِى يَرْزُقُكُمْ إِنْ أَمْسَكَ رِزْقَهُۥ ۚ بَل لَّجُّوا۟ فِى عُتُوٍّۢ وَنُفُورٍ","أَفَمَن يَمْشِى مُكِبًّا عَلَىٰ وَجْهِهِۦٓ أَهْدَىٰٓ أَمَّن يَمْشِى سَوِيًّا عَلَىٰ صِرَٰطٍۢ مُّسْتَقِيمٍۢ","قُلْ هُوَ ٱلَّذِىٓ أَنشَأَكُمْ وَجَعَلَ لَكُمُ ٱلسَّمْعَ وَٱلْأَبْصَـٰرَ وَٱلْأَفْـِٔدَةَ ۖ قَلِيلًۭا مَّا تَشْكُرُونَ","قُلْ هُوَ ٱلَّذِى ذَرَأَكُمْ فِى ٱلْأَرْضِ وَإِلَيْهِ تُحْشَرُونَ","وَيَقُولُونَ مَتَىٰ هَـٰذَا ٱلْوَعْدُ إِن كُنتُمْ صَـٰدِقِينَ","قُلْ إِنَّمَا ٱلْعِلْمُ عِندَ ٱللَّهِ وَإِنَّمَآ أَنَا۠ نَذِيرٌۭ مُّبِينٌۭ","فَلَمَّا رَأَوْهُ زُلْفَةًۭ سِيٓـَٔتْ وُجُوهُ ٱلَّذِينَ كَفَرُوا۟ وَقِيلَ هَـٰذَا ٱلَّذِى كُنتُم بِهِۦ تَدَّعُونَ","قُلْ أَرَءَيْتُمْ إِنْ أَهْلَكَنِىَ ٱللَّهُ وَمَن مَّعِىَ أَوْ رَحِمَنَا فَمَن يُجِيرُ ٱلْكَـٰفِرِينَ مِنْ عَذَابٍ أَلِيمٍۢ","قُلْ هُوَ ٱلرَّحْمَـٰنُ ءَامَنَّا بِهِۦ وَعَلَيْهِ تَوَكَّلْنَا ۖ فَسَتَعْلَمُونَ مَنْ هُوَ فِى ضَلَـٰلٍۢ مُّبِينٍۢ","قُلْ أَرَءَيْتُمْ إِنْ أَصْبَحَ مَآؤُكُمْ غَوْرًۭا فَمَن يَأْتِيكُم بِمَآءٍۢ مَّعِينٍۭ"]};

function streak(key){

  return n;
}
function kahfStreak(){
  const f = new Date(friKey()+'T12:00:00'); if (!kahfDone()) f.setDate(f.getDate()-7);

  return n;
}

/* --- Kahf weekly --- */
const friKey = () => { const d = new Date(); d.setDate(d.getDate() + (5 - d.getDay() + 7) % 7); return ymd(d) };

/* --- book engine: page curl --- */
async function setupBook(key, anchor){

  } else {
    BK.i = anchor ? Math.max(0, BK.pages.findIndex(d=>MUSHAF.pages[d.p].some(l=>l.w&&l.w.some(w=>w[0]===anchor)))) : exactIdx;

}
function pageAnchor(){ const d = BK.pages[BK.i]; if (d.f) return FLOW.words[d.w[0]][0]; const l = MUSHAF.pages[d.p].find(l=>l.t==='x'&&+l.w[0][0].split(':')[0]===SURAH[BK.key].sura); return l ? l.w[0][0] : null }
function $(id){ return document.getElementById(id) }
function clipPoly(pts, f){ const out = []; for (let i=0;i<pts.length;i++){ const a = pts[i], b = pts[(i+1)%pts.length], fa = f(a), fb = f(b);
  if (fa>=0) out.push(a); if ((fa>=0)!==(fb>=0)){ const t = fa/(fa-fb); out.push([a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t]) } } return out }

function constrain(P, cy){
  const {W,H} = BK, S1 = {x:W, y:cy}, S2 = {x:W, y:H-cy}, R2 = Math.hypot(W,H);
  let vx = P.x-S1.x, vy = P.y-S1.y, d = Math.hypot(vx,vy); if (d>W) P = {x:S1.x+vx/d*W, y:S1.y+vy/d*W};

}
function curl(P){

async function prep(dir, cy){

async function flip(dir){

let statTab = 'days';

function statsHTML(){

  const week = sumRange(wk0, now), month = sumRange(mo0, now);
  const days = Object.entries(IST.days).filter(([,n])=>n>0), active = days.length;
  const best = days.reduce((b,[k,n])=> n>b[1]?[k,n]:b, ['',0]);
  const avg = active ? Math.round(IST.total/active) : 0;
  let rows = [];
  if (statTab==='days'){ for (let k=0;k<7;k++){ const d = new Date(); d.setDate(d.getDate()-k); rows.push([k===0?'اليوم':k===1?'أمس':fmtD(d,{weekday:'short',day:'numeric',month:'short'}), IST.days[ymd(d)]||0]) } }

  if (statTab==='months'){ for (let k=0;k<7;k++){ const a = new Date(now.getFullYear(), now.getMonth()-k, 1), b = new Date(now.getFullYear(), now.getMonth()-k+1, 0);
    rows.push([k===0?'هذا الشهر':fmtD(a,{month:'long',year:'numeric'}), sumRange(a, b>now?now:b)]) } }

  const cell = (l,v) => `<div class="sc"><small>${l}</small><b class="digits">${AR(v)}</b></div>`;
  return `<div class="stat-sum">${cell('اليوم',today)}${cell('هذا الأسبوع',week)}${cell('هذا الشهر',month)}${cell('المجموع الكامل',IST.total)}</div>

const blind = document.createElement('div'); blind.className = 'blind'; blind.hidden = true; document.body.appendChild(blind);
let BL = null;
function startBlind(secs){
  BL = {secs, n:0, t0:performance.now(), done:false, raf:0};
  const C = 2*Math.PI*96;
  blind.innerHTML = `<button class="bl-x" data-bl="end">إنهاء</button>
    <div class="bl-ring">${secs?`<svg viewBox="0 0 200 200" aria-hidden="true"><circle class="trk" cx="100" cy="100" r="96"/><circle class="val" id="blT" cx="100" cy="100" r="96" stroke-dasharray="${C}" stroke-dashoffset="0"/></svg>`:''}
      <div class="bl-num"><b class="digits" id="blN">٠</b><small id="blS">${secs?AR(secs)+' ثانية':'عدّ بدون نظر'}</small></div></div>
    <p class="bl-f">${curForm().t}</p>
    <p class="bl-h">${secs?'':'اضغط في أي مكان. اهتزاز خفيف مع كل عدّة، وأقوى عند ٣٣ و١٠٠'}</p>`;
  blind.hidden = false; document.body.classList.add('lock');
  if (secs){ const tick = () => { const el = (performance.now()-BL.t0)/1000, left = Math.max(0, secs-el);
      const tc = $('blT'); if (tc) tc.style.strokeDashoffset = C*(el/secs); const sl = $('blS'); if (sl) sl.textContent = AR(Math.ceil(left))+' ثانية';
      if (left<=0) return endBlind(true); BL.raf = requestAnimationFrame(tick) }; BL.raf = requestAnimationFrame(tick) }
}
function endBlind(timeUp){
  if (!BL || BL.done) return; BL.done = true; cancelAnimationFrame(BL.raf);
  if (!BL.n && !timeUp){ closeBlind(); return }
  const dur = BL.secs ? (BL.secs===60?'دقيقة':AR(BL.secs)+' ثانية') : AR(Math.max(1,Math.round((performance.now()-BL.t0)/1000)))+' ثانية';
  vib([40,60,40]);
  blind.innerHTML = `<div class="bl-sum"><div class="bl-num"><b class="digits">${AR(BL.n)}</b><small>استغفار في ${dur}</small></div>
    <p>تقبّل الله. مجموعك اليوم <b class="digits">${AR(istToday())}</b></p>
    <div class="bl-btns"><button data-bl="again">جلسة أخرى</button><button data-bl="close">إنهاء</button></div></div>`;
}
function closeBlind(){ blind.hidden = true; document.body.classList.remove('lock'); BL = null; render(true) }
blind.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-bl]'); if (b) return;
  if (!BL || BL.done) return;
  BL.n++; istAdd('blind'); const n = $('blN'); if (n){ n.textContent = AR(BL.n); n.classList.remove('pop'); void n.offsetWidth; n.classList.add('pop') }
});
blind.addEventListener('click', e => { const b = e.target.closest('[data-bl]'); if (!b) return;
  if (b.dataset.bl==='end') endBlind(false); else if (b.dataset.bl==='again') startBlind(BL?BL.secs:30); else closeBlind() });

function draggable(el, onTap, snap){
  let sx, sy, ox, oy, moved = false, down = false;

    <div class="lk-time digits">${new Intl.DateTimeFormat('ar-u-nu-arab',{hour:'numeric',minute:'2-digit',hour12:true}).format(now).replace(/\s?[صم]$/,'')}</div>
    <div class="lk-row">
      <div class="lk-c" data-wadd role="button" aria-label="دائري"><svg viewBox="0 0 100 100">${wRing(44,8)}</svg><b class="digits" data-ist="today">${t}</b></div>
      <div class="lk-c" data-wadd role="button" aria-label="دائري بالسبحة"><svg viewBox="0 0 100 100" data-ist="beads">${beadsRing()}</svg><span class="lk-plus">+١</span></div>
      <div class="lk-r" data-wadd role="button" aria-label="مستطيل"><small>${curForm().s}</small><b class="digits"><span data-ist="today">${t}</span> <small>من <span data-ist="goal">${g}</span></small></b><span class="w-line lk-line"><i data-ist="bar" style="width:${Math.min(100,istToday()/istGoal()*100)}%"></i></span></div>
    </div>
  </div>
  <p class="wg-note">ويدجت شاشة القفل تأخذ لون الخلفية تلقائياً. النقر عليها يضيف استغفاراً في هذه التجربة، وفي الآيفون يفتح التطبيق على العدّاد.</p>`;
}
function openWidgets(){
  wg.innerHTML = `<div class="wg-bar"><button class="ibtn glass" data-wg="close" aria-label="إغلاق">${I.close}</button>
      <div class="seg glass">${[['home','الشاشة الرئيسية'],['lock','شاشة القفل']].map(([k,l])=>`<button data-wgt="${k}" aria-pressed="${wgTab===k}">${l}</button>`).join('')}</div>
      <span class="wg-n">اليوم <b class="digits" data-ist="today">${AR(istToday())}</b></span></div>
    <div class="wg-body ${wgTab}">${wgTab==='home' ? wgHome() + '<p class="wg-note">اضغط +١ أو أي ويدجت فيه حلقة لتعدّ. في الآيفون تُضاف من الضغط المطوّل على الشاشة الرئيسية ثم «تعديل» ثم «إضافة ويدجت» ثم «وِرد».</p>' : wgLock()}</div>`;
  wg.hidden = false; document.body.classList.add('lock');
}
wg.addEventListener('click', e => {
  const c = e.target.closest('[data-wg="close"]'); if (c){ wg.hidden = true; document.body.classList.remove('lock'); render(true); return }
  const t = e.target.closest('[data-wgt]'); if (t){ wgTab = t.dataset.wgt; openWidgets(); return }
  const a = e.target.closest('[data-wadd]'); if (a){ istAdd('widget'); const r = (e.target.closest('button[data-wadd]')||a).getBoundingClientRect();
    const f = document.createElement('div'); f.className = 'plus1'; f.textContent = '+١'; f.style.left = (r.left+r.width/2)+'px'; f.style.top = (r.top+8)+'px'; wg.appendChild(f); setTimeout(()=>f.remove(), 800);
    a.classList.remove('tap'); void a.offsetWidth; a.classList.add('tap') }
});

/* ===== launch animation ===== */
const splash = document.getElementById('splash');
document.getElementById('spMark').innerHTML = MARK;
let spTimers = [];
function endSplash(){ spTimers.forEach(clearTimeout); splash.classList.add('out'); spTimers = [setTimeout(()=>{ splash.hidden = true }, 520)] }
function playSplash(){
  spTimers.forEach(clearTimeout);
  splash.hidden = false; splash.className = ''; void splash.offsetWidth;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches){ splash.className = 's1 s2 s3'; spTimers = [setTimeout(endSplash, 900)]; return }
  const at = (ms, fn) => spTimers.push(setTimeout(fn, ms));
  at(60,  ()=>splash.classList.add('s1'));            // dot grows into a soft square
  at(560, ()=>splash.classList.add('s2'));            // the mark drops in from the top
  at(1000,()=>{ splash.classList.add('s3'); vib(10) }); // colour fills the icon
  at(1250,()=>splash.classList.add('s4'));            // glow rings pulse
  at(1350,()=>splash.classList.add('s5'));            // the star travels once around the beads
  at(3150,()=>vib(8));                                 // back in place
  at(3550, endSplash);                                 // pause, then open the app
}
splash.addEventListener('click', endSplash);
render();
playSplash();
</script>
