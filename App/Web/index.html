<style>
/* Layout: drafting table — slim top bar, full-bleed paper canvas with a floating tool rail, a contextual options card and a grouped tool dock at the thumb. */
:root{
  --bg:#E8ECE7; --panel:#FBFCFA; --raised:#FFFFFF; --fg:#18242A; --muted:#5F6D69; --line:#D3DAD3;
  --accent:#0E6E69; --accent-fg:#FFFFFF; --accent-soft:#DCEDE9; --gold:#B8862B; --danger:#A3312F;
  --paper:#F6F7F3; --shadow:0 6px 20px rgba(20,40,38,.10),0 1px 3px rgba(20,40,38,.08);
  --f-display:"Tajawal",system-ui,-apple-system,"Geeza Pro",sans-serif;
  --f-body:"Tajawal",system-ui,-apple-system,"Geeza Pro",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10171A; --panel:#172124; --raised:#1D292C; --fg:#E4EBE8; --muted:#93A29D; --line:#2A3639;
  --accent:#45B7AD; --accent-fg:#062220; --accent-soft:#1D3836; --gold:#D3A34A; --danger:#E0716B;
  --shadow:0 6px 20px rgba(0,0,0,.35),0 1px 3px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10171A; --panel:#172124; --raised:#1D292C; --fg:#E4EBE8; --muted:#93A29D; --line:#2A3639;
  --accent:#45B7AD; --accent-fg:#062220; --accent-soft:#1D3836; --gold:#D3A34A; --danger:#E0716B;
  --shadow:0 6px 20px rgba(0,0,0,.35),0 1px 3px rgba(0,0,0,.3); color-scheme:dark}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;background:var(--bg);color:var(--fg);font-family:var(--f-body);overflow:hidden;
  display:flex;flex-direction:column;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* top bar */
.top{display:flex;align-items:center;gap:4px;padding:6px 8px;background:var(--panel);border-bottom:1px solid var(--line)}
.proj{flex:1;min-width:0;display:flex;align-items:center;gap:8px;border:0;background:transparent;border-radius:10px;padding:6px 6px;text-align:right}
.proj:active{background:var(--accent-soft)}
.mark{width:30px;height:30px;border-radius:8px;background:var(--fg);display:grid;place-items:center;flex:none}
.mark svg{width:20px;height:20px}
.pt{min-width:0;display:flex;flex-direction:column;line-height:1.25}
.pt b{font-family:var(--f-display);font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt small{font-size:11px;color:var(--muted);display:flex;gap:6px;align-items:center;white-space:nowrap}
.ver{font-family:ui-monospace,Menlo,monospace;font-size:10px;padding:1px 5px;border-radius:4px;background:var(--accent);color:var(--accent-fg)}
.ib{width:40px;height:40px;flex:none;display:grid;place-items:center;border:0;background:transparent;border-radius:10px;color:var(--fg)}
.ib:active{background:var(--accent-soft)}
.ib:disabled{opacity:.28}
.ib.primary{background:var(--accent);color:var(--accent-fg);width:auto;padding:0 12px;display:flex;gap:6px;font-weight:600;font-size:14px}
/* stage */
.stage{position:relative;flex:1;min-height:0;background:var(--paper)}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.rail{position:absolute;top:10px;left:10px;display:flex;flex-direction:column;gap:6px;background:var(--raised);border:1px solid var(--line);border-radius:14px;padding:4px;box-shadow:var(--shadow)}
.rail .ib{width:42px;height:42px;flex-direction:column;display:flex;align-items:center;justify-content:center;gap:1px;font-size:9.5px;color:var(--muted)}
.rail .ib svg{color:var(--fg)}
.rail .ib[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.rail .ib[aria-pressed="true"] svg{color:var(--accent)}
#midBtn[aria-pressed="true"],#midBtn[aria-pressed="true"] svg{color:#D6336C!important;background:rgba(214,51,108,.12)}
.rail .fold{height:26px;border-radius:8px}
.rail .fold svg{width:18px;height:18px;transition:transform .2s}
.rail.min{padding:3px}
.rail.min .ib:not(.fold){display:none}
.rail.min .fold{width:34px;height:34px}
.rail.min .fold svg{transform:rotate(180deg)}
.zoom{position:absolute;bottom:10px;left:10px;font:11px ui-monospace,Menlo,monospace;color:var(--muted);background:var(--raised);border:1px solid var(--line);padding:3px 7px;border-radius:6px;pointer-events:none}
.toast{position:absolute;top:12px;right:50%;transform:translateX(50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:13px;pointer-events:none;opacity:0;transition:opacity .2s;max-width:80%;text-align:center}
.toast.on{opacity:1}
/* options card */
.panel{background:var(--panel);border-top:1px solid var(--line);padding:0 12px 8px;display:flex;flex-direction:column;gap:6px;border-radius:16px 16px 0 0;box-shadow:0 -6px 18px rgba(0,0,0,.06);position:relative;z-index:2;margin-top:-10px}
.grab{display:flex;justify-content:center;align-items:center;height:18px;border:0;background:transparent;padding:0;margin:0 auto;width:80px;touch-action:none}
.grab span{width:38px;height:5px;border-radius:3px;background:var(--line)}
.panel.min .pc{display:none}
.panel.min{padding-bottom:6px}
.fold-panel{width:32px!important;height:32px!important;margin-inline-start:auto;flex:none}
.fold-panel svg{width:20px;height:20px;transition:transform .2s}
.panel.min .fold-panel svg{transform:rotate(180deg)}
.grp{display:grid;grid-template-columns:58px 1fr;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.grp:first-child{border-top:0}
.gl{font-size:11.5px;font-weight:700;color:var(--muted);line-height:1.3}
.gr{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.swatch.cur{width:38px;height:38px;box-shadow:0 0 0 2px var(--accent)}
.swatch.sm{width:28px;height:28px;border-width:2px}
.ph{display:flex;align-items:center;gap:8px;min-height:32px}
.ph .tt{display:flex;align-items:center;gap:6px;font-family:var(--f-display);font-weight:800;font-size:15px;color:var(--accent);white-space:nowrap}
.ph .tt svg{width:18px;height:18px}
.ph .hint{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pc{display:flex;flex-direction:column;max-height:36vh;overflow-y:auto;overscroll-behavior:contain;padding-bottom:2px}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:2px;gap:2px;flex:none}
.seg button{border:0;background:transparent;border-radius:8px;padding:5px 10px;font-size:13px;display:flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap;color:var(--fg);min-height:34px}
.seg button svg{width:18px;height:18px}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--accent);box-shadow:0 1px 3px rgba(20,40,38,.16)}
.seg.icons button{flex-direction:column;gap:0;font-size:10px;padding:4px 6px;min-width:44px}
.seg.icons{flex-wrap:wrap;max-width:100%}
.chip{border:1px solid var(--line);background:var(--raised);border-radius:10px;padding:5px 10px;font-size:13px;white-space:nowrap;flex:none;display:flex;align-items:center;gap:6px;min-height:38px}
.chip svg{width:17px;height:17px}
.chip:active{background:var(--accent-soft)}
.chip.danger{color:var(--danger)}
.chip.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.stp{display:flex;align-items:center;gap:4px;background:var(--bg);border-radius:10px;padding:2px;flex:none;min-height:38px}
.stp .lbl{font-size:11.5px;color:var(--muted);padding-inline:4px 0}
.stp .lbl:empty{display:none}
.stp button{width:28px;height:30px;border:0;border-radius:8px;background:var(--raised);font-size:16px;line-height:1;display:grid;place-items:center}
.stp button:disabled{opacity:.35}
.stp output{min-width:30px;text-align:center;font:600 13px ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.swatch{width:34px;height:34px;border-radius:50%;border:3px solid var(--raised);box-shadow:0 0 0 1px var(--line);flex:none}
.count{font-size:12px;color:var(--accent);font-weight:600;background:var(--accent-soft);border-radius:8px;padding:4px 8px}
/* dock */
.dock{display:flex;align-items:stretch;justify-content:space-between;padding:4px 6px 6px;background:var(--panel);border-top:1px solid var(--line);gap:2px}
.dock .sep{width:1px;background:var(--line);margin:8px 2px}
.tool{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:transparent;padding:7px 0 5px;border-radius:12px;font-size:10.5px;font-weight:500;color:var(--muted);min-width:0}
.tool svg{width:22px;height:22px}
.tool[aria-pressed="true"]{color:var(--accent);background:var(--accent-soft)}
/* colour popover */
.pop{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom,0px));right:max(10px,env(safe-area-inset-right,0px));left:max(10px,env(safe-area-inset-left,0px));max-width:540px;margin:0 auto;background:var(--raised);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;box-shadow:0 12px 40px rgba(0,0,0,.35);z-index:40}
.pop h4{margin:0;font-size:12px;color:var(--muted);font-weight:500}
.pop .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pop .swatch{width:38px;height:38px}
.pop .swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
.custom{position:relative;width:38px;height:38px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 1px var(--line);background:conic-gradient(#d33,#db3,#3b5,#3ad,#53d,#d3a,#d33);flex:none}
.custom input{position:absolute;inset:-8px;width:54px;height:54px;opacity:0}
.addc{width:38px;height:38px;border-radius:50%;border:1.5px dashed var(--muted);background:transparent;display:grid;place-items:center;color:var(--muted)}
/* sheets */
.sheet-bg{position:fixed;inset:0;background:rgba(10,16,18,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{width:100%;max-width:560px;max-height:88%;overflow:auto;background:var(--panel);border-radius:18px 18px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet h2{margin:0;font-family:var(--f-display);font-size:21px;font-weight:800}
.sh-head{display:flex;align-items:center;justify-content:space-between}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.srow .k{font-size:14px}
.note{font-size:12px;color:var(--muted);line-height:1.6;margin:0}
.btn{border:0;background:var(--accent);color:var(--accent-fg);border-radius:12px;padding:12px;font-size:15px;font-weight:600}
.preview{border-radius:12px;border:1px solid var(--line);display:grid;place-items:center;padding:8px;
  background-color:#fff;background-image:linear-gradient(45deg,#e5e5e5 25%,transparent 25%,transparent 75%,#e5e5e5 75%),linear-gradient(45deg,#e5e5e5 25%,transparent 25%,transparent 75%,#e5e5e5 75%);background-size:16px 16px;background-position:0 0,8px 8px}
.preview img{max-height:240px;max-width:100%;display:block;-webkit-touch-callout:default}
.plist{display:flex;flex-direction:column;gap:6px}
.pitem{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--raised)}
.pitem.cur{border-color:var(--accent);background:var(--accent-soft)}
.pitem .nm{flex:1;min-width:0;text-align:right;border:0;background:transparent;padding:0}
.pitem .nm b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pitem .nm small{color:var(--muted);font-size:11px}
.txt{width:100%;font:inherit;font-size:16px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.toggle{width:46px;height:28px;border-radius:14px;border:0;background:var(--line);position:relative;flex:none}
.toggle::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:right .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle[aria-pressed="true"]{background:var(--accent)}
.toggle[aria-pressed="true"]::after{right:21px}
.opt-card{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--raised)}
.opt-card h3{margin:0;font-family:var(--f-display);font-weight:800;font-size:16px;display:flex;align-items:center;gap:8px}
.opt-card h3 svg{width:22px;height:22px;color:var(--accent)}
.pickimg{border:1.5px dashed var(--muted);border-radius:14px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--muted);background:transparent;font-size:14px}
.pickimg svg{width:34px;height:34px}
.twin{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.twin>div{border-radius:10px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;padding:6px;min-height:120px}
.twin img,.twin canvas{max-width:100%;max-height:150px;display:block}
.crop-wrap{border-radius:14px;overflow:hidden;background:#0D1416}
#cropCv{position:static;display:block;width:100%;height:min(52vh,440px);touch-action:none}
.twin canvas{position:static;inset:auto;width:auto;height:auto;touch-action:auto}
.twin small{display:block;text-align:center;color:var(--muted);font-size:11px;margin-top:4px}
input[type=range]{accent-color:var(--accent);width:150px}

/* v5.4 — one size for every control: same height, same type, equal columns */
:root{--ctl-h:46px;--ctl-f:14px}
.grp{display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:10px 0}
.gl{font-size:12px;font-weight:700;color:var(--muted)}
.gr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-items:stretch}
.gr>.seg,.gr>.swrow,.gr>.icrow,.gr>.full{grid-column:1/-1}
.swrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;min-height:var(--ctl-h)}
.icrow{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px}
.icrow .chip{justify-content:center;padding:0}
.seg{display:flex;width:100%;border-radius:12px;padding:3px;gap:3px;min-height:var(--ctl-h)}
.seg button{flex:1 1 0;min-width:0;font-size:var(--ctl-f);min-height:40px;padding:4px 6px;border-radius:9px;overflow:hidden;text-overflow:ellipsis}
.seg.icons{flex-wrap:nowrap}
.seg.icons button{font-size:11px;min-width:0;padding:4px 2px}
.chip{min-height:var(--ctl-h);font-size:var(--ctl-f);border-radius:12px;justify-content:center;padding:0 10px;min-width:0}
.chip span{overflow:hidden;text-overflow:ellipsis}
.chip span:empty{display:none}
.stp{display:grid;grid-template-columns:40px minmax(0,1fr) 40px;grid-template-rows:auto 38px;gap:4px 4px;border-radius:12px;padding:6px;min-width:0;width:100%;align-items:center}
.stp .lbl{grid-column:1/-1;font-size:12.5px;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
.stp .lbl:empty{display:none}
.stp button{width:40px;height:38px;border-radius:9px;font-size:18px}
.stp output{min-width:0;text-align:center;font:600 15px ui-monospace,Menlo,monospace}
.count{min-height:auto}
.count{display:flex;align-items:center;justify-content:center;min-height:var(--ctl-h);border-radius:12px;font-size:var(--ctl-f);padding:0 8px}
.gr>.toggle{justify-self:start;align-self:center}
/* sheet sections */
.sec{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:16px;background:var(--raised)}
.sec-h{font-family:var(--f-display);font-weight:800;font-size:15px}
.sec .note{margin:0}
.trow{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:var(--ctl-h);font-size:var(--ctl-f)}
.trow+.trow{border-top:1px solid var(--line)}
.sec .stp,.sec .seg{background:var(--bg)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="top" dir="rtl">
  <button class="proj" id="projBtn" aria-label="المشاريع">
    <span class="mark" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="M3 3h4v10h10v4H3z" fill="#F6F7F3"/><path d="M11 3h6v6h-6z" fill="#45B7AD"/></svg></span>
    <span class="pt"><b id="projName">—</b><small>معمار الكوفي <span class="ver" id="ver">v5.4</span></small></span>

  const nx=-(b[1]-a[1]),ny=b[0]-a[0],L=Math.hypot(nx,ny);if(L<0.2)return;

  const targets=P.shapes.filter(s=>s.t!=='corner'&&isGeo(s)&&samples.some(p=>shapeHit(s,p,0)));
  if(!targets.length){toast('اسحب الخط عبر الشكل الذي تريد قصه');return}
  snap();let n=0;
  for(const s of targets){const rings=ringsOf(s),A=[],B=[];
    for(const r of rings){const ra=clipHalf(r,n0,n1,c),rb=clipHalf(r,-n0,-n1,-c);if(ra.length>2&&Math.abs(ringArea(ra))>1e-4)A.push(ra);if(rb.length>2&&Math.abs(ringArea(rb))>1e-4)B.push(rb)}
    if(!A.length||!B.length)continue;const ix=P.shapes.indexOf(s),fx=q=>q.map(p=>[+p[0].toFixed(5),+p[1].toFixed(5)]);
    P.shapes.splice(ix,1,{t:'poly',polys:A.map(fx),c:s.c},{t:'poly',polys:B.map(fx),c:s.c});n++}
  if(!n){undoStack.pop();toast('الخط لم يعبر الشكل كاملاً');return}
  toast('قُصّ '+n+' شكل إلى جزأين');commit();
}
function decompose(){
  const g=P.grid,pt=pitch(),list=sel.filter(s=>s.t!=='corner'&&isGeo(s));if(!list.length)return;
  const edges=(lo,hi)=>{const out=[lo,hi];for(let k=Math.floor(lo/pt)-1;k*pt<=hi+pt;k++){for(const e of[k*pt,k*pt+g.S])if(e>lo+1e-6&&e<hi-1e-6)out.push(e)}return[...new Set(out)].sort((p,q)=>p-q)};
  snap();const made=[];let total=0;
  for(const s of list){const rings=ringsOf(s),b=shapeBox(s),X=edges(b.x0,b.x1),Y=edges(b.y0,b.y1),pieces=[];
    for(let i=0;i<X.length-1;i++)for(let j=0;j<Y.length-1;j++){const part=[];
      for(const r of rings){let q=clipHalf(r,-1,0,-X[i]);q=clipHalf(q,1,0,X[i+1]);q=clipHalf(q,0,-1,-Y[j]);q=clipHalf(q,0,1,Y[j+1]);if(q.length>2&&Math.abs(ringArea(q))>1e-4)part.push(q.map(p=>[+p[0].toFixed(5),+p[1].toFixed(5)]))}
      if(part.length)pieces.push({t:'poly',polys:part,c:s.c})}
    total+=pieces.length;if(total>900){undoStack.pop();toast('الشكل كبير جداً للتفكيك، صغّر التحديد');return}
    P.shapes.splice(P.shapes.indexOf(s),1,...pieces);made.push(...pieces)}
  sel=made;toast('تفكك إلى '+made.length+' قطعة');commit();
}

/* ---------- export ---------- */
const EX={fmt:'png',bg:'none',bgc:'#FFFFFF',frame:'square',margin:0.12,size:2048};
function tightBounds(){
  const r=allBox();if(!r)return null;
  const K=24,pad=1;let w=Math.ceil((r.x1-r.x0+2*pad)*K),h=Math.ceil((r.y1-r.y0+2*pad)*K);
  const sc=Math.min(1,4000/Math.max(w,h)),k=K*sc;w=Math.ceil(w*sc);h=Math.ceil(h*sc);
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
  x.setTransform(k,0,0,k,-(r.x0-pad)*k,-(r.y0-pad)*k);paintAll(x,'#000');
  const d=x.getImageData(0,0,w,h).data;let x0=w,y0=h,x1=-1,y1=-1;
  for(let j=0;j<h;j++)for(let i=0;i<w;i++)if(d[(j*w+i)*4+3]>10){if(i<x0)x0=i;if(i>x1)x1=i;if(j<y0)y0=j;if(j>y1)y1=j}
  if(x1<0)return null;return{x:x0/k+r.x0-pad,y:y0/k+r.y0-pad,w:(x1-x0+1)/k,h:(y1-y0+1)/k};
}
function layout(b,L){const m=EX.margin;
  if(EX.frame==='square'){const sc=L*(1-2*m)/Math.max(b.w,b.h);return{sc,cw:L,ch:L,ox:(L-b.w*sc)/2,oy:(L-b.h*sc)/2}}
  const sc=L*(1-2*m)/Math.max(b.w,b.h),pad=L*m;return{sc,cw:Math.round(b.w*sc+2*pad),ch:Math.round(b.h*sc+2*pad),ox:pad,oy:pad}}
function makePNG(b){const g=layout(b,EX.size),c=document.createElement('canvas');c.width=g.cw;c.height=g.ch;const x=c.getContext('2d');
  x.setTransform(g.sc,0,0,g.sc,g.ox-b.x*g.sc,g.oy-b.y*g.sc);paintAll(x);
  if(EX.bg==='color'){x.setTransform(1,0,0,1,0,0);x.globalCompositeOperation='destination-over';x.fillStyle=EX.bgc;x.fillRect(0,0,g.cw,g.ch)}
  return new Promise(res=>c.toBlob(res,'image/png'))}
const f=n=>+n.toFixed(4);
function svgD(subs){let d='';const pt=q=>f(q[0])+' '+f(q[1]);
  for(const sp of subs){let cur=null;for(const k of sp){
    if(k.M){d+='M'+pt(k.M);cur=k.M}else if(k.L){d+='L'+pt(k.L);cur=k.L}
    else if(k.ARC){const[x,y,r,a0,a1,ccw]=k.ARC,P0=[x+r*Math.cos(a0),y+r*Math.sin(a0)],P1=[x+r*Math.cos(a1),y+r*Math.sin(a1)];
      if(!cur)d+='M'+pt(P0);else if(!eq(cur,P0))d+='L'+pt(P0);const sw=ccw?0:1,span=Math.abs(a1-a0);
      if(span>=Math.PI*2-1e-6){const am=a0+(ccw?-Math.PI:Math.PI),Pm=[x+r*Math.cos(am),y+r*Math.sin(am)];d+=`A${f(r)} ${f(r)} 0 0 ${sw} ${pt(Pm)}A${f(r)} ${f(r)} 0 0 ${sw} ${pt(P0)}`;cur=P0}
      else{d+=`A${f(r)} ${f(r)} 0 ${span>Math.PI?1:0} ${sw} ${pt(P1)}`;cur=P1}}
    else if(k.Q){d+=`Q${f(k.Q[0])} ${f(k.Q[1])} ${f(k.Q[2])} ${f(k.Q[3])}`;cur=[k.Q[2],k.Q[3]]}
    else if(k.Z)d+='Z'}}
  return d}
function makeSVG(b){
  const g=layout(b,1000),u=1/g.sc,vx=b.x-g.ox*u,vy=b.y-g.oy*u,vw=g.cw*u,vh=g.ch*u;
  let o=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${f(vx)} ${f(vy)} ${f(vw)} ${f(vh)}" width="${g.cw}" height="${g.ch}">`;
  const K=P.shapes.filter(s=>s.t==='corner'),cuts=K.filter(k=>k.mode==='cut'),pd=q=>'M'+q.map(p=>f(p[0])+' '+f(p[1])).join('L')+'Z',clip=P.env&&P.env.clip;
  o+='<defs>';
  if(cuts.length)o+=`<mask id="cuts" maskUnits="userSpaceOnUse" x="${f(vx)}" y="${f(vy)}" width="${f(vw)}" height="${f(vh)}"><rect x="${f(vx)}" y="${f(vy)}" width="${f(vw)}" height="${f(vh)}" fill="#fff"/><path d="${cuts.map(k=>pd(cornerPoly(k))).join('')}" fill="#000"/></mask>`;
  if(clip)o+=`<clipPath id="env"><path d="${svgD(envCmds(P.env))}"/></clipPath>`;
  o+='</defs>';
  if(EX.bg==='color')o+=`<rect x="${f(vx)}" y="${f(vy)}" width="${f(vw)}" height="${f(vh)}" fill="${EX.bgc}"/>`;
  if(clip)o+='<g clip-path="url(#env)">';
  if(cuts.length)o+='<g mask="url(#cuts)">';
  let gi=0;const L=P.shapes.filter(s=>s.t!=='corner'&&s.t!=='depth');
  while(gi<L.length){
    if(isGeo(L[gi])){const col=L[gi].c;let d='';while(gi<L.length&&isGeo(L[gi])&&L[gi].c===col){d+=svgD(geom(L[gi]));gi++}o+=`<path d="${d}" fill="${col}" fill-rule="nonzero"/>`;continue}
    const s=L[gi++],a=`fill="none" stroke-linejoin="miter" stroke-miterlimit="10" stroke-linecap="${s.cap||'butt'}"`;
    if(s.t==='line')o+=`<path d="M${s.pts.map(p=>f(p[0])+' '+f(p[1])).join(' L')}${s.closed?' Z':''}" stroke="${s.c}" stroke-width="${s.w}" ${a}/>`;
    else if(s.a1-s.a0>=360)o+=`<circle cx="${f(s.cx)}" cy="${f(s.cy)}" r="${f(s.r)}" stroke="${s.c}" stroke-width="${s.w}" ${a}/>`;
    else{const p=d=>[f(s.cx+s.r*Math.cos(d*Math.PI/180)),f(s.cy+s.r*Math.sin(d*Math.PI/180))],[a0x,a0y]=p(s.a0),[a1x,a1y]=p(s.a1);
      o+=`<path d="M${a0x} ${a0y} A${f(s.r)} ${f(s.r)} 0 ${s.a1-s.a0>180?1:0} 1 ${a1x} ${a1y}" stroke="${s.c}" stroke-width="${s.w}" ${a}/>`}
  }
  if(cuts.length)o+='</g>';
  o+=svgInline()+svgDepths();
  K.filter(k=>k.mode==='add').forEach(k=>{o+=`<path d="${pd(cornerPoly(k))}" fill="${k.c}"/>`});
  if(clip)o+='</g>';
  return new Blob([o+'</svg>'],{type:'image/svg+xml'});
}
let lastURL=null;

  <button class="btn" id="xSave">حفظ الملف</button>
  <p class="note" id="xNote">الشعار يوضع في المنتصف تماماً بهوامش متساوية، والشبكة والقالب لا يظهران في الملف.</p>`);
  const img=sh.querySelector('#exImg');

  bind('xF','fmt');bind('xB','bg');bind('xR','frame');bind('xM','margin',true);bind('xS','size',true);
